# The gates CLAUDE.md §2 and DESIGN.md §6 name. Until this file existed, "CI
# proves it" appeared in eight places across the documentation and nothing ran.
#
# One rule governs this file: a green run must mean something was checked. The
# workspace has no crates yet, so the crate-dependent gates cannot run — they
# are skipped with a visible annotation rather than passed silently.
name: CI

# One run per commit, and it comes from the pull request. CLAUDE.md §8 says
# implementation happens on a branch per plan and "gates must be green FOR THAT
# COMMIT, not merely for the branch tip" — so every commit on the branch must be
# checked, which `push: branches: [main]` alone cannot do. `pull_request` does
# it, on the condition §8 now carries: the pull request is opened as a DRAFT at
# the FIRST commit of a branch, not at the last. A branch with no pull request
# open is a branch with no CI.
#
# `push:` used to be bare as well, and the pair doubled every run:
# `[measured 2026-09-13]` commit 5693c91 ran the whole suite twice — runs
# 34740563843 and 34740565981, 14 jobs each, 28 job-runs for one commit —
# because the concurrency group below was keyed on `github.ref`, which is
# `refs/heads/<branch>` for a push and `refs/pull/<n>/merge` for a pull request.
# Two groups, so neither run could ever cancel the other.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Keyed on the BRANCH, not the ref: `github.head_ref` is set only on
# `pull_request` and holds the source branch name, while `github.ref` on that
# same event holds `refs/pull/<n>/merge`. Keying on the branch means a second
# push to a branch cancels the first branch's run whichever event delivered it.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # No global RUSTFLAGS: -D warnings here. The clippy step already denies them,
  # and a global setting would split cargo's build cache between the clippy and
  # test steps for no extra coverage — and would leak into the temp crate that
  # scripts/check-lint-config.sh builds.

jobs:
  # The one gate that is meaningful today, and the only one that does not
  # depend on a crate existing. It proves by reversal that the workspace lint
  # configuration actually denies unwrap/expect/panic — CLAUDE.md §2 rule 7.
  lint-config:
    name: Lint config enforces non-negotiable 7
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup component add clippy
      - run: scripts/check-lint-config.sh
      # Two text checks that answer the same question from the other side:
      # check-lint-config.sh proves the workspace CONFIGURATION denies
      # unwrap/expect/panic; these two prove nothing in the tree quietly
      # switches that configuration back off.
      #
      # `[measured 2026-09-08]` STATUS.md item 58: `indexing_slicing = "deny"`
      # was inert across engine, session and dict for the length of one build,
      # because three debt annotations were written `#![allow(...)]` at the top
      # of a lib.rs — an INNER attribute at a crate root silences the whole
      # crate. check-indexing-debt.sh kept reading exactly the right number the
      # whole time, because --force-warn overrides an allow. The number
      # everybody looks at was right while the enforcing half was off.
      - run: scripts/check-no-crate-root-allow.sh
      # `[measured 2026-08-31]` STATUS.md item 23: check-lint-config.sh built
      # its scratch crate in `mktemp -d`, where rust-toolchain.toml does not
      # reach, so on a desktop with no `rustup default` it reported the
      # workspace lints as not denying — while clippy had never run. The
      # instance is fixed; this guards the class. Note it can only fail here
      # for a tree reason, never a machine one: the check reads text.
      - run: scripts/check-scratch-fixtures.sh
      # CLAUDE.md §2 non-negotiable 9 (ADR-0104): exactly three QuickFIX files
      # ship, byte-identical to the pin, under NOTICE. This job never fetches
      # vendor/, so this step exercises the sha256-only path — "vendor
      # absent: sha256 only" is expected output here, not a warning. The
      # `dict-no-vendor` job below deliberately never fetches vendor/ either,
      # so ITS pin-script step is also sha256-only, by design (the point of
      # that job is proving fixbolt-dict builds without vendor/ at all). The
      # byte-for-byte comparison against vendor/'s own copy only ever runs in
      # the `gates` job, which is the one job in this file that both fetches
      # vendor/ and runs this script.
      - run: scripts/check-dict-spec-pin.sh
      # The reversal for the check above: proves each of its FAIL arms fires
      # for the reason it claims (CLAUDE.md §10). Cheap — pure bash and one
      # single-byte file edit via python3, no cargo, no network — so it runs
      # right beside the check it proves, on every commit.
      - run: scripts/check-dict-spec-pin-reversal.sh
      # ADR-0093 decision 2, plan docs/plans/2026-09-22-the-detector-and-the-
      # campaign-preconditions.md step 3: does a `sudo` line in scripts/ hand
      # root a command it can find, or a name that only exists on the
      # CALLER's PATH? `sudo -n perf record … -- cargo bench …` in boot D's
      # own plan cell ran five times, wrote a header-only .data file and
      # exited 0 — `perf` is on root's secure_path, `~/.cargo/bin` is not,
      # and nothing read the workload's own output.
      # docs/reference/perf-record-exits-zero-when-sudo-cannot-find-the-workload.md
      - run: scripts/check-sudo-names-what-root-can-find.sh
      # `[added 2026-09-12]` plan docs/plans/2026-09-12-gates-that-match-a-meaning.md,
      # section E: the three scripts this plan writes or rewrites are shell,
      # and shell is where a quoting bug (item 66b) lives. `ubuntu-latest`
      # ships shellcheck already; this names exactly the three files rather
      # than scanning `scripts/` wholesale — two of the nineteen other
      # scripts there need the §9 machine to prove a quoting fix changed
      # nothing, which this job cannot do.
      #
      # `[measured 2026-09-12]` **`-S info`, not `-S warning`, and the
      # difference is the whole point of the line.** The plan said
      # `-S warning`, and its own reversal — an unquoted variable — came back
      # GREEN. SC2086 is severity *info*, so `-S warning` can never see the
      # one defect class section E named as its reason to exist. Measured on
      # shellcheck 0.11.0, one probe per level: error 0, warning 0,
      # info SC2086, style SC2086. Plan revision Sửa 1.
      #
      # `[measured 2026-09-22]` scripts/ab-rotation.sh and
      # scripts/check-ab-rotation.sh joined the list, which is what the plan
      # (docs/plans/2026-09-22-the-detector-and-the-campaign-preconditions.md,
      # trap table) asked for on the condition that they are clean: both are,
      # at `-S info`, on this branch and on `main`. They belong here rather
      # than being left out with the other scripts: they need no §9 machine
      # to prove a quoting fix changed nothing, since their pure halves are
      # already tested by check-ab-rotation.sh in the script-logic job.
      - run: shellcheck -S info scripts/check-no-crate-root-allow.sh scripts/check-scratch-fixtures.sh scripts/check-feature-gated-tests-ran.sh scripts/check-sudo-names-what-root-can-find.sh scripts/check-sudo-verdicts.sh scripts/ab-rotation.sh scripts/check-ab-rotation.sh scripts/check-dict-spec-pin.sh scripts/check-dict-spec-pin-reversal.sh

  # `[measured 2026-08-30]` scripts/check-ktls-available.sh printed
  # `config: CONFIG_TLS=m` and then "it was built without CONFIG_TLS" in the SAME
  # run, and STATUS.md open item 10 stayed blocked on that sentence for a day.
  # Nothing could have caught it: the script was a gate nothing gated. The
  # classification is pure logic, so it is checked here on every push, on a runner
  # whose own kernel state is irrelevant to the result.
  #
  # check-machine-verdicts.sh is here for the same reason and a sharper one: its
  # `not virtualised` row decides whether the OTHER §9 rows can mean anything, and
  # this repository has no VM to test it against. A guest does not fail governor,
  # turbo, C-states or SMT loudly — the files are simply absent — so it reads as
  # under-configured rather than as structurally unable. THIS RUNNER IS A GUEST,
  # so the bench job's machine block now says so on every run.
  script-logic:
    name: The machine probes reach the right verdicts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: scripts/check-ktls-classify.sh
      - run: scripts/check-machine-verdicts.sh
      # ADR-0068 decision 5: `dispersion` (min/median and max/median, every
      # published percentile) is pure, so it is checked here the same way
      # `virt_verdict` and friends are, fed the 2026-09-14 trap's own numbers.
      - run: scripts/check-w2w-baseline-summary.sh
      - run: scripts/check-w2w-compare.sh
      # ADR-0093 decision 2: the pure functions behind
      # check-sudo-names-what-root-can-find.sh, fed boot D's own line, the
      # six advisory strings already in check-machine.sh, and the R1/R2/G1
      # fixtures the plan names — the same shape as the two checks above.
      - run: scripts/check-sudo-verdicts.sh
      # `[measured 2026-09-22]` this script has existed since step 1 of
      # docs/plans/2026-09-22-the-detector-and-the-campaign-preconditions.md
      # and had never run in CI — `grep check-ab-rotation .github/workflows/
      # ci.yml` found nothing, the same hole check-w2w-compare.sh and
      # check-w2w-baseline-summary.sh above were added here to close for
      # their own siblings. It tests ab_median / ab_complete_rounds /
      # ab_summary / ab_extract, the pure parts of scripts/ab-rotation.sh.
      - run: scripts/check-ab-rotation.sh
      # `[measured 2026-09-10]` This runner CAN offload TLS, and that answer is
      # what made the `tls` job below buildable as written: kernel
      # `6.17.0-1022-azure`, `CONFIG_TLS=m`, module loaded, `/proc/net/tls_stat`
      # present, `setsockopt(TCP_ULP, "tls")` ACCEPTED, verdict `READY`.
      #
      # Kept, and kept non-fatal. It is the `tls` job's diagnostic: when that
      # job goes red on a kernel assertion, this line says in one glance whether
      # the runner changed under us or the engine broke. `|| true` because a
      # step that can fail is a gate, and the gate is the other job.
      - name: What this runner's kernel says about TLS offload (informational)
        run: scripts/check-ktls-available.sh || true

  # Also meaningful today: this repository is 17 markdown files and has already
  # shipped dead links twice, both found by hand.
  links:
    name: No dead internal links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Turns GitHub's documented behaviour into this repository's own
      # measurement. On `pull_request`, `actions/checkout` with no `ref:` checks
      # out `refs/pull/<n>/merge` — the merge of the head into the base, not the
      # head itself — which is the reason a run on the merge commit afterwards
      # adds nothing while the base has not moved. Printed, never asserted: if
      # GitHub changes this, it should show up here as a surprise to read rather
      # than as a red build nobody can explain.
      #
      # `[measured 2026-09-13]` the first version of this step read `%P` and got
      # a BLANK line — `actions/checkout` defaults to `fetch-depth: 1`, so the
      # tip is grafted and has no parents in the local repository. Nothing was
      # wrong with what was being measured; the field had been emptied by the
      # fetch depth. `subject` carries the same fact and survives a shallow
      # clone, and `shallow` is printed beside it so a blank `parents` is never
      # again read as "not a merge".
      # docs/reference/a-shallow-clone-emptied-the-field-the-check-read.md
      - name: What was actually checked out (informational)
        run: |
          echo "event        = ${{ github.event_name }}"
          echo "github.sha   = ${{ github.sha }}"
          echo "pr head sha  = ${{ github.event.pull_request.head.sha }}"
          echo "pr base sha  = ${{ github.event.pull_request.base.sha }}"
          echo "shallow      = $(git rev-parse --is-shallow-repository)"
          git log -1 --format='HEAD    = %H%nsubject = %s%nparents = %P'
      - run: scripts/check-links.py
      - run: scripts/check-adr-numbers.sh

  # STATUS.md items 78 and 79 (ADR-0065): a feature combination no gate
  # builds. CI's clippy ran under the default set and under `--features
  # affinity` *with* `standard` also on; nothing ran `--no-default-features
  # --features affinity`, so `crates/engine/src/shard.rs`'s `use
  # crate::msglog::MaybeLog` — needed only by code gated `#[cfg(feature =
  # "standard")]` — printed `warning: unused import` under `cargo test` and
  # nothing failed, because a warning is not a test failure (item 78).
  # Separately, an intra-doc link resolved under `--all-features` and broke
  # under `--features affinity` alone, caught by a developer reading rustdoc
  # output by hand, not by this file (item 79).
  #
  # One job now builds every feature set of every workspace crate to depth
  # two — no features, each feature alone, each pair — with `cargo-hack`, and
  # runs `clippy -D warnings` and `doc` over that whole set, then once more
  # under `--all-features`. Depth two, not more: every defect of this family
  # found here so far needed exactly one feature on and one off (ADR-0065
  # decision 2) — the boundary is read here and every time DESIGN.md §6's row
  # for this gate is read; it does not grow just because the feature count
  # does. This job also absorbs what the `docs` job used to check — `cargo
  # doc` under the default set (a member of the powerset) and under
  # `--all-features` (the explicit steps at the end) — so that job is gone;
  # its guard is the comment on the doc step below.
  #
  # **`--all-features` is NOT in the powerset, which is why it is two steps
  # of its own.** `[measured 2026-09-13]` cargo-hack counts `default` as a
  # feature, so `fixbolt-engine`'s depth-two sets are ten — none, default,
  # standard, affinity, tls, affinity+default, affinity+standard,
  # affinity+tls, default+tls, standard+tls — and `standard,affinity,tls` is
  # three named features, one past the depth. CI run 34750085195's log lists
  # exactly those ten. Removing the `docs` job had silently removed the only
  # rustdoc build under `--all-features` (the item-61 set) until these steps.
  #
  # THIS JOB RUNS NO TEST. It lints and documents every feature set; it does
  # not execute one assertion in any of them. The step "The fix50sp2 tests, and
  # proof they were the ones that ran", in the `gates` job below, is
  # what runs a feature-gated test, and the `tls` job is the other one — see
  # docs/reference/a-feature-gated-test-is-a-test-ci-never-runs.md
  # for the commit where reading this job as though it did cost a green run on
  # a deliberately red test.
  feature-sets:
    name: Every feature set to depth two builds, lints and documents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup component add clippy
      # fixbolt-dict generates its tables from the QuickFIX XML at build time,
      # and every set built below compiles every crate that depends on it.
      - run: scripts/fetch-quickfix-assets.sh
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack

      # Clippy rather than `check`: clippy also runs rustc's own lints, and
      # `-D warnings` is what turns item 78's printed warning into a red job.
      # `--keep-going` so one red feature set does not hide the rest.
      - run: cargo hack clippy --workspace --all-targets --feature-powerset --depth 2 --keep-going -- -D warnings

      # **Run again over the same sets, because one rustdoc invocation cannot
      # see a module behind a feature it did not enable.** `[measured
      # 2026-09-10]` the item-61 defect this generalises: a single `cargo doc
      # --workspace --no-deps` was green about `crates/engine/src/tls.rs` for
      # as long as that file had existed, because `mod tls` is
      # `#[cfg(feature = "tls")]` and the default build never documented it at
      # all. That was fixed by hand-adding one more set, `--all-features`;
      # items 78 and 79 are the same shape one layer out — a link can resolve
      # under one set and break under another — so the fix now runs every set
      # the clippy step above already builds, plus `--all-features` in the
      # last step, because the powerset to depth two does not contain it.
      # Same family as STATUS.md item 57 and
      # docs/reference/feature-flags-unify-across-a-workspace.md: a gate that
      # reports ok about something it was never handed.
      #
      # `-D warnings`, not two named lints: STATUS.md item 83 found
      # `private_intra_doc_links` warn-and-ignored here, and naming it would
      # only have closed that one instance — `bare_urls` and four more
      # warn-by-default rustdoc lints were next in line. ADR-0066.
      - run: RUSTDOCFLAGS="-D warnings" cargo hack doc --workspace --no-deps --feature-powerset --depth 2 --keep-going

      # Every feature on at once — not a member of the depth-two powerset
      # (see the job comment). The doc step is the item-61 set, restored.
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # `-D warnings`: ADR-0066, same reasoning as the powerset doc step above.
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --all-features

  # CLAUDE.md's first paragraph: this repository is going to be published, and
  # every commit is treated as already public. Nothing looked at what the
  # dependency tree is licensed under, or whether anything in it carries an
  # advisory — the two facts that are cheapest to fix now and most expensive to
  # discover after a release. Plan:
  # docs/plans/2026-09-07-three-gates-a-sibling-engine-has.md, step 1.
  #
  # It is BLOCKING. A gate that warns is a gate nobody reads — CLAUDE.md §10.
  deny:
    name: Every dependency is permissively licensed and unadvised
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # deny.toml is judged against the resolved graph, and fixbolt-dict's
      # build.rs reads vendor/. cargo-deny only needs `cargo metadata`, which
      # does not run build scripts — but the fetch is cheap and keeps this job
      # reading the same tree every other job builds.
      - run: scripts/fetch-quickfix-assets.sh
      # `--all-features` so this reads the same graph whatever cargo-deny's
      # default happens to be. `[measured 2026-09-09]` `check` already saw the
      # optional `tls` tree without it — removing `ISC` from deny.toml made it
      # red on `ring`/`rustls-webpki` either way — so this is belt and braces
      # on the step that was already honest, and the real hole was one step
      # down. See the note on that step.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

      # `[measured 2026-09-08]` this comparison exists because cargo-deny used
      # not to judge dev-dependencies at all, and the first attempt at closing
      # that — `[graph] exclude-dev` — changed nothing: the wrong table. Every
      # amendment below this line, up to 2026-09-09, was this guard chasing
      # that hole with a narrower cargo side rather than a fixed cargo-deny
      # side, which is precisely the defect
      # `a-guard-that-watched-a-gate-shared-its-blind-spot.md` is about: a
      # guard that compares two views of the same hole cannot see the hole.
      #
      # `[measured 2026-09-12]` **the hole is closed, not covered.**
      # `[licenses] include-dev = true` in `deny.toml` is the right knob:
      # `cargo deny check licenses` and `cargo deny list` now judge this
      # workspace's dev-dependencies exactly as they judge normal ones. So both
      # sides of this comparison ask the plain question again — *did cargo-deny
      # judge every crate cargo resolves, dev-dependencies included?* — with no
      # narrowing on the cargo side to hide anything. Equal today, 46 and 46.
      #
      # `scripts/check-every-crate-is-licensed.sh`, in the step below, stays:
      # a different tool (`cargo metadata`), a different parser, judged
      # against the same `deny.toml` allow list. One route agreeing with
      # itself would be no evidence at all.
      #
      # `cargo deny check advisories` is a third graph again, and it DOES see
      # dev-dependencies: `[measured 2026-09-09]` it found RUSTSEC-2026-0009 in
      # `time`, reached through `rcgen`, a dev-dependency. Three graphs, one
      # binary, one workspace.
      #
      # STATUS.md open item 57.
      # `--color never` on both sides, and it is not cosmetic. `[measured
      # 2026-09-08]` this job's first run was red on two identical lists:
      # `CARGO_TERM_COLOR: always` at the top of this file wrapped the
      # `cargo deny list` names in ANSI escapes and left `cargo tree`'s plain,
      # so the diff reported all eleven crates as both missing and added. The
      # same one-line environment variable broke the indexing-debt gate on the
      # same run, in the same way, and neither had been tested under it.
      - name: cargo-deny judged every crate cargo resolves
        run: |
          cargo install cargo-deny --locked --version 0.20.2 2>/dev/null || cargo install cargo-deny --locked
          cargo deny --color never --all-features list 2>/dev/null \
            | sed 's/^[^:]*: //' | tr ',' '\n' | sed 's/@.*//;s/ //g' | sort -u | grep -v '^$' > /tmp/deny-saw.txt
          cargo tree --color never --workspace --all-features --prefix none \
            | sed 's/ v[0-9].*//;s/ //g' | sort -u | grep -v '^$' > /tmp/cargo-saw.txt
          echo "cargo-deny judged $(wc -l < /tmp/deny-saw.txt) crates; cargo resolves $(wc -l < /tmp/cargo-saw.txt)"
          if ! diff -u /tmp/deny-saw.txt /tmp/cargo-saw.txt; then
            echo "::error title=The licence gate did not look at every crate::cargo-deny's graph and cargo's disagree. Lines marked + are crates cargo resolves that the licence and advisory gate never judged. See deny.toml's closing comment and STATUS.md item 57."
            exit 1
          fi

      # The half cargo-deny cannot do, from a source that is not cargo-deny.
      # Dev-dependencies included; every licence checked against deny.toml's own
      # allow list, parsed out of that file rather than copied. STATUS.md item
      # 57's actual coverage, as opposed to its alarm.
      - name: Every crate cargo resolves is permissively licensed
        run: scripts/check-every-crate-is-licensed.sh

  # CLAUDE.md §2 non-negotiable 7's fourth machine check, and the one that would
  # have seen the bug the other three could not. `[measured 2026-09-06]` a ring
  # dispatch record gained a field, `fixed[OUT_SEQ..OUT_LAST_PROCESSED]` went
  # from four bytes to five in silence, and `copy_from_slice` panicked inside a
  # library crate — `a[i..j]` names neither unwrap, expect nor panic, so
  # `unwrap_used`, `expect_used` and `panic` are all blind to it.
  #
  # The debt is 207 sites in crates/*/src and cannot be cleared in one diff, so
  # the lint is denied and the files that still owe carry a scoped `allow`. This
  # job counts them anyway, with `--force-warn`, which overrides an allow, and
  # fails when the total moves in either direction — up is a regression, down is
  # a ceiling somebody forgot to lower. STATUS.md item 55.
  indexing-debt:
    name: The indexing debt only goes down
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup component add clippy
      - run: scripts/fetch-quickfix-assets.sh
      - run: scripts/check-indexing-debt.sh

  gates:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Sửa 8 §8.3: `Cargo.toml` uses caret requirements for rustls and ring
      # (kept, not pinned with `=` — a library `=` breaks every consumer who
      # needs a different 0.23.x, per the Cargo book). That leaves exactly one
      # hole: a manifest edit committed without its matching `Cargo.lock`. This
      # step is early and cheap on purpose — every other job in this file reads
      # the same commit's lock and manifest, so a mismatch here means a
      # mismatch everywhere, and one red here is worth more than ten reds
      # repeating the same fact. Not `--frozen`: CI still needs the network to
      # fetch what the lock names.
      - name: Cargo.lock is current for this commit
        run: |
          if ! cargo metadata --locked --format-version 1 > /dev/null; then
            echo "::error title=Cargo.lock is out of date::cargo metadata --locked found a manifest that does not match the committed Cargo.lock. Fix: commit the updated Cargo.lock alongside the manifest change (Sửa 8, docs/plans/2026-09-04-tls.md)."
            exit 1
          fi

      - run: rustup component add rustfmt clippy

      - id: ws
        name: How many crates are there to check?
        run: |
          n=$(cargo metadata --no-deps --format-version 1 | jq '.packages | length')
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "Workspace members: $n"
          if [ "$n" -eq 0 ]; then
            echo "::error title=Nothing to check::cargo metadata reports 0 workspace members. This workspace holds six crates, so zero means a broken checkout or a broken manifest — not an empty repository. Failing rather than passing on nothing: CLAUDE.md §10, a green result that was inferred rather than observed is not a result. STATUS.md open item 26."
            exit 1
          fi

      # fixbolt-dict generates its tables from the QuickFIX XML at build time and
      # fails the build when it is absent — deliberately, see crates/dict/build.rs.
      # vendor/ is gitignored (ADR-0001), so CI fetches it before anything builds.
      - run: scripts/fetch-quickfix-assets.sh

      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all

      # `crates/dict/build.rs` dies when a <message> in the FIX XML carries no
      # `msgcat` attribute, and that path had never once been observed to
      # fire — code, not a reproduced red. CLAUDE.md §10 says a guard is
      # proven by reversal; this is that reversal, run on every commit rather
      # than once by hand. docs/plans/2026-09-20-the-desk-free-residue.md
      # row 214, `Not proven (b)`.
      - name: The dictionary generator refuses a message with no msgcat, and the two die arms beside it
        run: scripts/check-dict-refuses-a-message-without-msgcat.sh

      # ADR-0104 (CLAUDE.md §2 non-negotiable 9): this job fetched vendor/
      # above, so this step exercises check-dict-spec-pin.sh's cmp-against-
      # vendor path — the shipped crates/dict/spec/ files are not merely the
      # right sha256, they are the SAME bytes as the test oracle's own copy.
      - run: scripts/check-dict-spec-pin.sh

      # `fixbolt-dict`'s interop_quickfix_*.rs tests are the oracle for the
      # tables `crates/dict/spec/` now generates directly (ADR-0104 decision
      # 8), and they are gated on nothing but vendor/ being present — no
      # feature flag names them. `cargo test --all` above ran them, but
      # nothing had PROVEN that until now: the same gap
      # docs/reference/a-feature-gated-test-is-a-test-ci-never-runs.md
      # names for a feature-gated test applies here to a vendor-gated one.
      # `-` tells check-feature-gated-tests-ran.sh to build with no
      # `--features` flag at all rather than skip the reconcile step.
      - name: fixbolt-dict's own oracle tests, and proof they were the ones that ran
        run: |
          set -o pipefail
          cargo test -p fixbolt-dict --tests --no-fail-fast --locked 2>&1 | tee /tmp/dict-default.log
          scripts/check-feature-gated-tests-ran.sh fixbolt-dict - /tmp/dict-default.log

      # `affinity` is off by default and Linux-only (ADR-0015 decision 9), so
      # the two steps above never compile a line of it. Without this the module
      # and its five tests would be a gate nothing gates — the shape this
      # repository keeps paying for: see the kTLS diagnostic that contradicted
      # its own output for a day, and check-lint-config.sh, which was red on the
      # developer machine and green here.
      #
      # The second command is the combination nothing else covers: `affinity`
      # WITHOUT `standard`. Both take the same optional `libc`, so a mistake in
      # how that dependency is shared only shows up when one feature is on and
      # the other is off.
      - name: The affinity feature builds, lints and passes on its own
        run: |
          cargo clippy --all-targets --features affinity -- -D warnings
          cargo test -p fixbolt-engine --features affinity
          cargo test -p fixbolt-engine --no-default-features --features affinity

      # `[measured 2026-09-19]` THIS CLOSES THE GAP IN
      # docs/reference/a-feature-gated-test-is-a-test-ci-never-runs.md: until
      # this step existed, `grep -n fix50sp2 .github/workflows/ci.yml` matched
      # NOTHING. Every FIXT test file opens with `#![cfg(feature =
      # "fix50sp2")]`, so `cargo test --all` and `cargo test --all
      # --no-default-features` compiled all of them to nothing — five test
      # binaries (dict `fixt`, dict `fixt_order`, session `fixt`, session
      # `score_fixt`, engine `wire_fixt`) that CI had never executed on any
      # commit since the feature was created. A commit was pushed deliberately
      # red, with a failing `score_fixt` quoted in its message, and CI reported
      # success, 14 jobs of 14.
      #
      # WHAT THIS IS *NOT*, AND WHY A READER NEEDS TELLING: the `feature-sets`
      # job above already covers `fix50sp2` — with `cargo hack clippy` and
      # `cargo hack doc` over the feature powerset. That is **lint and
      # documentation**. It compiles the gated test files and type-checks them;
      # it never runs one, and an assertion that compiles is not an assertion
      # that holds. "The powerset job covers the feature" is a true sentence
      # about two of the three things a reader means by it. The gap sat next to
      # the job that looked like it closed it, which is why it survived.
      #
      # ONE LOOP ITERATION PER CRATE THAT *DECLARES* THE FEATURE, not per crate
      # that happens to have a gated test today — `fixbolt-codec` has none yet,
      # and the boundary "declares it" is the one that cannot quietly reopen
      # when the next gated test is written. Whole crate suites, never a
      # `--test <name>` list: STATUS.md item 68 is that list springing the trap
      # twice in one day, and `dict/tests/group_tables.rs` is the same shape
      # here — not `#![cfg]`-gated at all, it grows cases under an inner
      # `#[cfg(feature = "fix50sp2")]` that no file-name list would have named.
      #
      # `cargo hack test --workspace --feature-powerset --depth 2` would cover
      # this generically. It was not chosen for three reasons: it re-runs the
      # ENTIRE workspace suite — the engine's socket tests included — once per
      # feature set, for a feature whose tests live in four named crates; a red
      # line in its output does not say which set was meant; and, decisively,
      # it would still be a step whose tick is its own exit status, which is
      # precisely the evidence STATUS.md item 62 proved worthless.
      #
      # THE EVIDENCE IS THE SCRIPT'S `ok` LINE, NOT THIS STEP'S TICK. Same
      # shape as the `tls` job below, and the same script: the build is asked
      # which tests exist under the feature, and the log of the run must
      # account for every one of them — a binary with no `Running` line is R2,
      # a listed test with no run status is R1, an `ignored` test is R3. That
      # is what turns "the command exited 0" into "these named tests executed".
      # `cargo test` is run with `--no-fail-fast` and its status caught rather
      # than allowed to abort, so the script reads a RED run's log too: "a test
      # failed" and "no test ran" must not arrive as the same tick.
      #
      # KNOWN HOLE, stated rather than papered over: the script takes `--tests`,
      # so DOCTESTS gated on this feature would still run nowhere. It is the
      # hole its own header names for `tls`, unchanged here; there is no
      # `fix50sp2` doctest today.
      #
      # The check on this check is the one thing no YAML file can assert:
      # break a feature-gated test on purpose and watch CI go red. Until that
      # has been observed, this step is a claim, not a measurement — CLAUDE.md
      # §10, and the whole reason the reference page above exists.
      - name: The fix50sp2 tests, and proof they were the ones that ran
        run: |
          set -o pipefail
          tests_failed=""
          checks_failed=""
          for p in fixbolt-codec fixbolt-dict fixbolt-session fixbolt-engine; do
            echo "=== ${p} --features fix50sp2 ==="
            status=0
            cargo test -p "${p}" --tests --features fix50sp2 --no-fail-fast --locked \
              2>&1 | tee "/tmp/fix50sp2-${p}.log" || status=$?
            if ! scripts/check-feature-gated-tests-ran.sh "${p}" fix50sp2 "/tmp/fix50sp2-${p}.log"; then
              checks_failed="${checks_failed} ${p}"
            fi
            if [ "$status" -ne 0 ]; then
              tests_failed="${tests_failed} ${p}"
            fi
          done

          # Name what failed, and quote the assertion, in the step that failed.
          # `[measured 2026-09-19]` the first version of this step printed only
          # `exit 1` after the LAST crate's `ok` line, so a red run read as
          # "fixbolt-engine is fine, and something exited 1" and cost two CI
          # rounds to locate. A gate that cannot say what it caught is a gate
          # somebody will switch off. CLAUDE.md §10: read the output, not the
          # exit status — that applies to the output this job itself writes.
          for p in ${tests_failed}; do
            echo "::group::${p} — the failing tests"
            sed -n '/^failures:$/,/^test result: FAILED/p' "/tmp/fix50sp2-${p}.log" || true
            echo "::endgroup::"
          done

          if [ -n "${checks_failed}" ]; then
            echo "::error title=A fix50sp2 test did not run::Not accounted for in:${checks_failed}. scripts/check-feature-gated-tests-ran.sh could not account for every test the fix50sp2 build lists. Read its FAIL lines above: R1 a listed test with no run status, R2 a built binary with no Running line, R3 a test that was ignored. See docs/reference/a-feature-gated-test-is-a-test-ci-never-runs.md."
            exit 1
          fi
          if [ -n "${tests_failed}" ]; then
            echo "::error title=A fix50sp2 test failed::Failing crates:${tests_failed}. These tests PASS under \`cargo test --all\`, which does not enable the feature, so a failure here is a fix50sp2-only failure. The grouped output above names each one."
            exit 1
          fi

      # The two socket gates, run many times at once — ADR-0087 decision 5.
      #
      # `cargo test --all` above runs `wire` exactly once, on a runner doing
      # nothing else, and a socket harness that is green that way has said
      # nothing about a contended one. `[measured 2026-09-20]` the fix50sp2
      # socket gate read 0 red in 40 sequential runs and **11 red in 50** as ten
      # concurrent copies, on a branch and on `main` alike — the same commit
      # green and red in the same minute, which is the reference page this step
      # is named after:
      # docs/reference/the-same-commit-went-red-and-green-in-the-same-minute.md.
      #
      # WHAT IT COUNTS, AND WHAT IT DOES NOT: passes and failures, not
      # nanoseconds. Nothing here depends on the DESIGN.md §9 settings and no
      # number from it may be quoted as latency (CLAUDE.md §2 non-negotiable
      # 10). The size is what a small runner can carry, so the pressure here and
      # the pressure on the §9 desk are different pressures: a green run bounds
      # nothing, a red one is a real defect.
      #
      # THE EVIDENCE IS THE `N red in M` LINE, not this step's tick — and the
      # `lifeline hit:` count beside it is the second half. A harness that
      # settles on the 5 s lifeline rather than on a counted record has gone
      # back to measuring the machine, and both test files assert that number at
      # zero, so a slow green here is a red.
      - name: The socket corpus under contention, both harnesses
        run: scripts/check-socket-corpus-under-contention.sh 2 8

      # `STATUS.md` item 85, ADR-0096 decision 4(a): `compare-w2w-procedures.sh`
      # is the comparator ADR-0068 decision 2 names, and this is its own
      # reversal (a 6% pair FAILs, a 4% pair PASSes, at each of p50, p99,
      # p99.9) — already run under the `script-logic` job above, alongside
      # this repository's other pure-function probes. It is run again here,
      # in `gates`, because ADR-0068's rule is "no longer applied by hand":
      # the comparator that decides whether a published wire figure
      # reproduced is exactly as load-bearing as `cargo test`, `clippy` and
      # the socket corpus above, and belongs on the same gate that blocks a
      # merge, not only on the advisory job that reports script logic.
      - name: The w2w procedure comparator, and its own reversal
        run: scripts/check-w2w-compare.sh

      # ADR-0102 decision 1: a timed line that moves while its instruction
      # count does not is a layout move, not a regression — but only if the
      # same-work / work-changed / unstable verdict is read at the
      # thresholds the decision actually names (0.1% between arms, 0.01%
      # within one arm), not at whatever a script happens to compute today.
      # This is `scripts/bench-instructions.sh`'s own self-test: a stub
      # `perf` drives it through all three verdicts plus a missing-counter
      # and a workload-exit-1 refusal, with no real hardware counters and no
      # `sudo` — safe on this runner, where the PMU is usually unavailable
      # (decision 1's own note), unlike the real-counter run that only
      # happens on the desk. Belongs on this gate for the same reason
      # check-w2w-compare.sh does just above: the rule that decides whether a
      # re-record's cause is named *layout* is exactly as load-bearing as
      # `cargo test` and clippy.
      - name: The instruction-count verdict rule, its stub self-test
        run: scripts/check-bench-instructions.sh

      # ADR-0171 decision 5: nothing in the toolchain sees a series renamed
      # inside a JSON blob, and Grafana's own "export for sharing" shape
      # carries `__inputs` / `${DS_PROMETHEUS}`, which file provisioning
      # cannot fill in (grafana/grafana#10786). This is the dashboard-shape
      # oracle: valid JSON, no `__inputs`, no `${DS_`, every panel and target
      # on the `${datasource}` template variable, every target has an `expr`,
      # panel ids unique. It does not know whether a queried series exists —
      # that is `cargo test -p fixbolt-metrics --test dashboard` above (part
      # of `cargo test --all`), which scrapes a real fixture and compares
      # names.
      - name: The Grafana dashboard names no data source and every panel has an expr
        run: python3 scripts/check-grafana-dashboard.py

      # ADR-0171 decision 4: `promtool check metrics` is the format's own
      # oracle, not this crate's encoder read back by itself. A pinned
      # Prometheus release (version and SHA-256 in the script) is fetched
      # into `target/`, never the repository tree, and checked against the
      # release's own `sha256sums.txt` before it runs a single byte — the
      # same pattern `scripts/interop-qfj.sh` uses for a pinned JVM oracle
      # (ADR-0130). No `--allow-skip` here: on this runner, absence of
      # `promtool` is a real gate failure, not an accepted local shortcut.
      - name: The Prometheus exposition format, checked by promtool
        run: scripts/check-metrics-format.sh

      # Phase 4 row 1 senior review F4 (i). `scripts/scrape-loop.sh` is the 10 Hz
      # load the mode scripts run under and row 2's scrape-on arm, and it once
      # waited for each answer before the next — 4.2 Hz asked 10
      # (docs/reference/a-synchronous-scrape-waits-for-the-exporters-next-tick.md).
      # Against a listener that answers after 300 ms, an open loop still sends
      # at ~10 Hz and a closed one at ~2.5 Hz; the script FAILs under 0.9 × the
      # rate asked. Its reversal — the `&` after `curl` removed — goes red here.
      - name: scrape-loop.sh keeps its rate against a slow listener
        run: |
          python3 -c '
          import http.server as h, time
          class H(h.BaseHTTPRequestHandler):
              def do_GET(s):
                  time.sleep(0.3); s.send_response(200); s.end_headers(); s.wfile.write(b"ok\n")
              def log_message(s, *a): pass
          h.ThreadingHTTPServer(("127.0.0.1", 19465), H).serve_forever()' &
          srv=$!
          for _ in $(seq 50); do curl -s -o /dev/null 127.0.0.1:19465/metrics && break; sleep 0.1; done
          scripts/scrape-loop.sh 127.0.0.1:19465 10 2; rc=$?
          kill "${srv}"
          exit "${rc}"

      # Plan docs/plans/2026-09-24-p4-sqlite-store.md row 5: the SQLite store
      # soak for 2 s. **A COUNT, NOT A MEASUREMENT**: it exits non-zero when a
      # record is unwritten, a row is missing or differs from the generator, or
      # the stand-in engine thread missed its pace on more than 1 % of
      # messages — and asserts nothing about speed. `target/soak` is on the
      # runner's disk; the soak refuses a tmpfs directory itself. Row 4a's
      # 60 s kill line is run on the desk, never here.
      - name: The SQLite store soak, 2 s, a count
        run: cargo run --release -p fixbolt-store-sqlite --example soak -- --rate 50000 --seconds 2 --dir target/soak

  # STATUS.md open item 19. `rust-toolchain.toml` pins the toolchain so that a
  # clippy release cannot turn this repository red with no commit behind it —
  # `[measured 2026-08-30]` clippy::byte_char_slices did exactly that. Pinning
  # alone would only trade that surprise for a slow drift, so this job runs the
  # NEWEST stable and is allowed to fail: the next such lint arrives here as a
  # warning to read, at the time it appears, instead of as a red morning later.
  #
  # continue-on-error is the whole point. If this job is ever made blocking, the
  # pin stops being a pin and item 19 is back.
  clippy-latest-stable:
    name: clippy on the newest stable (advisory, never blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - id: ws
        run: |
          n=$(cargo metadata --no-deps --format-version 1 | jq '.packages | length')
          echo "count=$n" >> "$GITHUB_OUTPUT"
          if [ "$n" -eq 0 ]; then
            echo "::error title=Nothing to check::cargo metadata reports 0 workspace members — a broken checkout or manifest. STATUS.md open item 26."
            exit 1
          fi
      - run: rustup toolchain install stable --profile minimal --component clippy
      - run: |
          echo "pinned:  $(cargo --version)"
          echo "newest:  $(cargo +stable --version)"
      - run: scripts/fetch-quickfix-assets.sh
      - run: cargo +stable clippy --all-targets -- -D warnings

  # CLAUDE.md §2 non-negotiable 4: the engine thread never sleeps in the kernel.
  # STATUS.md open item 15, which had no machine check at all until 2026-08-30 —
  # two attempts to build one both reported success while a sleep was present.
  #
  # This one traces a real binary and requires its own RED half to fail, so a
  # green here cannot mean "the check is broken".
  no-kernel-sleep:
    name: The engine thread never sleeps in the kernel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: ws
        run: |
          n=$(cargo metadata --no-deps --format-version 1 | jq '.packages | length')
          echo "count=$n" >> "$GITHUB_OUTPUT"
          if [ "$n" -eq 0 ]; then
            echo "::error title=Nothing to check::cargo metadata reports 0 workspace members — a broken checkout or manifest. STATUS.md open item 26."
            exit 1
          fi
      - run: sudo apt-get update && sudo apt-get install -y strace
      - run: scripts/fetch-quickfix-assets.sh
      # `[2026-09-13]` The script's kTLS arm needs a `tls` build and a runner
      # that can offload; without both it reports SKIPPED, NOT PASSED, exit 2.
      - name: This runner must be able to offload TLS
        run: |
          verdict="$(scripts/check-ktls-available.sh | tail -n +1 | grep -E '^(READY|NOT_BUILT|OTHER|NOT_LOADED)' | head -1)"
          echo "verdict: ${verdict:-<none>}"
          if [ "$verdict" != "READY" ]; then
            echo "::error title=This runner cannot offload TLS::scripts/check-ktls-available.sh did not say READY. This is the environment, not the engine."
            exit 1
          fi
      - run: cargo build -p fixbolt-w2w --release --features tls
      - run: scripts/check-no-kernel-sleep.sh

      # ADR-0072: the tracer-free second machine check for non-negotiable 4's
      # `hft` half — no `strace`, no capability, so it is the one that would
      # still run on a real NIC (STATUS.md open item 86). This runner has none,
      # but the check itself needs nothing the runner cannot give it.
      - run: scripts/check-no-kernel-sleep-by-ctxt.sh

      # `[2026-09-02]` `--path app` — `NewOrderSingle` -> `ExecutionReport`,
      # the path DESIGN.md §8's table is actually about — is new, and the gate
      # above drives only `--path admin`. So it is run here once, small, for its
      # own three assertions rather than for a timing figure: the reply must be
      # a `35=8`, it must carry the ClOrdID that was just sent, and the timed
      # window must allocate nothing. All three are inside the binary and fire
      # per message, so a runner with no isolated cores is a perfectly good
      # place to check them; only the nanoseconds need §9, and this step reads
      # none.
      - name: The app path's own oracle, on every message
        run: |
          ./target/release/w2w --path app --messages 500 --warmup 100 | tee /tmp/app.txt
          grep -q 'allocs *0 ' /tmp/app.txt
          grep -q 'NewOrderSingle -> ExecutionReport' /tmp/app.txt

      # The mirror of the `standard` lesson in tools/w2w/Cargo.toml: a flag that
      # is accepted and does nothing is worse than one that is refused. Without
      # `--features affinity` this build CANNOT pin, so `--engine-core` must be
      # an error — and a green here is the only thing standing between a future
      # run and a figure labelled §9 that never pinned a thread.
      - name: A build that cannot pin refuses --engine-core
        run: |
          if ./target/release/w2w --engine-core 0 --messages 10 --warmup 2; then
            echo "::error title=A flag that does nothing::--engine-core was accepted by a build with no affinity feature"
            exit 1
          fi

      # `[2026-09-14]` Sửa 2 of docs/plans/2026-09-04-the-second-linux-desk.md,
      # Điều 1: the `--wire-timestamps` arm, a step of its own so its red never
      # hides the plain arm's. It needs `--features affinity` for
      # `--observer-core`, so it rebuilds after the refusal step above has read
      # the no-affinity binary. The script runs itself inside `unshare -Urn`;
      # Ubuntu 24.04's AppArmor refuses unprivileged user namespaces by default,
      # and the sysctl below is how Ubuntu's 24.04 release notes say to allow
      # them — only when the probe is refused. The observer takes the last cpu.
      - name: The engine thread's syscalls with --wire-timestamps on lo, in a user namespace
        run: |
          if ! unshare -Urn true 2>/dev/null; then
            echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
          fi
          cargo build -p fixbolt-w2w --release --features tls,affinity
          W2W_EXTRA="--wire-timestamps --nic lo --observer-core $(( $(nproc) - 1 ))" \
            scripts/check-no-kernel-sleep.sh

  # CLAUDE.md §2 non-negotiable 4, SECOND HALF: in `standard` mode the engine
  # thread must block when idle and give the core back. ADR-0013 decision 6
  # asked for it; until this job existed rule 4 was half-enforced and
  # CLAUDE.md's own machine-checked list said so.
  #
  # It asserts four things because CPU near zero is passable by an engine that
  # is broken in three different ways — a dead thread, a run that never reached
  # the mode it was asked for, and an engine woken by its own 100 ms timeout
  # rather than by the data. `[measured 2026-08-30]` that last one is not
  # hypothetical: with `Block` made to ignore readiness the p50 goes to
  # 99 046 599 ns, one whole timeout, while CPU stays at 0% and the thread is
  # found sleeping 20 times out of 20. Two of the four assertions pass and only
  # the fourth catches it.
  #
  # And it requires its own red halves to fail, on the POLICY rather than on a
  # broken measurement — the two are separate exit codes for a reason.
  standard-blocks:
    name: A standard engine gives the core back
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: ws
        run: |
          n=$(cargo metadata --no-deps --format-version 1 | jq '.packages | length')
          echo "count=$n" >> "$GITHUB_OUTPUT"
          if [ "$n" -eq 0 ]; then
            echo "::error title=Nothing to check::cargo metadata reports 0 workspace members — a broken checkout or manifest. STATUS.md open item 26."
            exit 1
          fi
      - run: scripts/fetch-quickfix-assets.sh
      # `[2026-09-13]` The script's kTLS arm needs a `tls` build and a runner
      # that can offload; without both it reports SKIPPED, NOT PASSED, exit 2.
      - name: This runner must be able to offload TLS
        run: |
          verdict="$(scripts/check-ktls-available.sh | tail -n +1 | grep -E '^(READY|NOT_BUILT|OTHER|NOT_LOADED)' | head -1)"
          echo "verdict: ${verdict:-<none>}"
          if [ "$verdict" != "READY" ]; then
            echo "::error title=This runner cannot offload TLS::scripts/check-ktls-available.sh did not say READY. This is the environment, not the engine."
            exit 1
          fi
      - run: cargo build -p fixbolt-w2w --release --features tls
      - run: scripts/check-standard-gives-the-core-back.sh

      # `[2026-09-14]` Sửa 2 of docs/plans/2026-09-04-the-second-linux-desk.md,
      # Điều 1: the same arm for the second half of rule 4, as its own step. It
      # cannot see the POLLERR trap (the script's header says why); w2w's refusal
      # of `standard` on a hardware NIC stands in for it.
      - name: A standard engine gives the core back with --wire-timestamps on lo, in a user namespace
        run: |
          if ! unshare -Urn true 2>/dev/null; then
            echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
          fi
          cargo build -p fixbolt-w2w --release --features tls,affinity
          W2W_EXTRA="--wire-timestamps --nic lo --observer-core $(( $(nproc) - 1 ))" \
            scripts/check-standard-gives-the-core-back.sh

  # CLAUDE.md §2 non-negotiable 6: this must build on a machine with nothing
  # optional installed. Its own runner, so it cannot inherit anything a
  # previous step put there.
  # `[measured 2026-09-10]` **Nothing had ever run a TLS test.** `ci.yml` passed
  # `--features affinity` for the shard tests and `--all-features` to cargo-deny
  # and cargo-doc, and never `--features tls` to `cargo test` — so
  # crates/engine/tests/{tls,tls_wire,tls_mode}.rs ran on one desktop and every
  # green pull request since the feature landed was green about code it had not
  # compiled a test for. Found by grepping a GREEN run's log for a test name and
  # getting zero. STATUS.md item 62, plan
  # docs/plans/2026-09-10-the-tls-tests-have-no-ci.md.
  #
  # **Its own job, not a step on `fmt · clippy · test`.** One of these tests
  # asserts /proc/net/tls_stat moved, which is a claim about the *runner* rather
  # than about this engine. Folded into a job that runs six other things, a
  # kernel that lost its tls module would read as "the test suite is broken".
  tls:
    name: TLS, with the kernel it needs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: scripts/fetch-quickfix-assets.sh
      # **The environment is asserted first, and fails in its own words.** Not
      # caution: before this, a missing kernel module surfaced four minutes later
      # as `tls_stat TlsTxSw did not move` — an assertion that reads as an engine
      # defect. An environment that cannot run the test must fail differently
      # from an engine that is broken.
      - name: This runner must be able to offload TLS
        run: |
          verdict="$(scripts/check-ktls-available.sh | tail -n +1 | grep -E '^(READY|NOT_BUILT|OTHER|NOT_LOADED)' | head -1)"
          echo "verdict: ${verdict:-<none>}"
          if [ "$verdict" != "READY" ]; then
            echo "::error title=This runner cannot offload TLS::scripts/check-ktls-available.sh did not say READY. The TLS tests below assert that the kernel took the keys, and on this runner they cannot mean anything. This is the environment, not the engine — see STATUS.md item 62."
            exit 1
          fi
      - run: cargo clippy --all-targets --features tls -- -D warnings
      # `[measured 2026-09-12]` **The list is gone.** It used to be five
      # `--test` file names, and that shape sprang the same trap twice in one
      # day: `tests/tls_settings_wire.rs` landed and this line did not name
      # it, then the senior review of PR #63 found three
      # `#[cfg(feature = "tls")]` tests living inside `tests/settings.rs` — a
      # file the list had no reason to name, because most of it is not about
      # TLS. One of those three, `into_table_refuses_a_file_that_asks_for_tls`,
      # guards the expensive mistake `Problem::NeedsTlsDoor` exists for: a
      # configuration that asks for TLS poured into plain `serve`, serving
      # plaintext on a port the operator believes is encrypted. STATUS.md
      # item 68, same shape as item 62 one layer in.
      #
      # The evidence now is that the build lists its own tests below
      # (`--tests --features tls`, then `-- --list`) and the log of the run
      # must account for every one of them — read
      # scripts/check-feature-gated-tests-ran.sh's `ok` line, not this
      # step's tick.
      - name: The TLS tests, and proof they were the ones that ran
        run: |
          set -o pipefail
          # `--no-fail-fast`, because `[measured 2026-09-12]` the red run of this
          # job reported six tests when there are eleven: cargo stops at the
          # first failing test binary, so `tls_wire.rs` and `tls_mode.rs` had
          # still never run on any machine but the owner's desk.
          # The status is caught rather than allowed to abort the step, so
          # that the script below is run against a RED run too — it is what
          # the script reads in the log, not this command's exit status, that
          # separates "a test failed" from "no test ran".
          status=0
          cargo test -p fixbolt-engine --tests --features tls --no-fail-fast --locked \
            2>&1 | tee /tmp/tls-tests.log || status=$?
          scripts/check-feature-gated-tests-ran.sh fixbolt-engine tls /tmp/tls-tests.log
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          # **Three repetitions of the `tls` binary, and all three must pass.**
          # `[measured 2026-09-12]` runs 34666630103 and 34666631877 on commit
          # 31fc0ec: 3 of 5 repetitions were red while this job finished green,
          # because the gate ran the flaky test exactly once and hit a good
          # roll. One green is what let a scheduling race live in this file.
          fails=0
          for i in 1 2 3; do
            echo "=== tls.rs repetition ${i} of 3 ==="
            if ! cargo test -p fixbolt-engine --features tls --locked --test tls; then
              fails=$((fails + 1))
            fi
          done
          echo "tls.rs repetitions failed: ${fails} of 3"
          if [ "$fails" -ne 0 ]; then
            echo "::error title=The TLS tests are not deterministic::${fails} of 3 repetitions of the tls binary failed. A single green says nothing here — see the comment above this step."
            exit 1
          fi

  no-default-features:
    name: Builds with nothing optional installed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: ws
        run: |
          n=$(cargo metadata --no-deps --format-version 1 | jq '.packages | length')
          echo "count=$n" >> "$GITHUB_OUTPUT"
          if [ "$n" -eq 0 ]; then
            echo "::error title=Nothing to check::cargo metadata reports 0 workspace members — a broken checkout or manifest. STATUS.md open item 26."
            exit 1
          fi
      - run: scripts/fetch-quickfix-assets.sh
      - run: cargo test --all --no-default-features

      # `[measured 2026-08-30]` THE STEP ABOVE DOES NOT PROVE WHAT IT READS AS,
      # and on its own this job was green about a build that never happened.
      # `--no-default-features` applies to the invocation, and cargo unifies
      # features across everything in it — so `tools/w2w`, a workspace member
      # depending on `fixbolt-engine` with defaults on, switched the `standard`
      # feature back on for the whole build and `libc` was compiled anyway.
      # The flag under test was turned back on by a sibling crate.
      #
      # Asking per crate is the only scope where the flag means what it says.
      # See docs/reference/feature-flags-unify-across-a-workspace.md.
      - run: scripts/check-no-optional-deps.sh

  # ADR-0097 exit criterion 1, ADR-0104: `fixbolt-dict` must build with
  # nothing but what crates.io gives a downloader — no `vendor/`, no network,
  # no external toolchain. Every OTHER job in this file calls
  # `scripts/fetch-quickfix-assets.sh` before building anything that depends
  # on `fixbolt-dict`, which is exactly why none of them could ever have
  # caught a regression back to reading `vendor/`: they all made vendor/
  # present first. This job is the one place that deliberately never does,
  # on its own runner so a stray fetch anywhere else in the workflow cannot
  # leak a checkout into it.
  #
  # `test ! -e vendor` is not decorative: a runner image, an action, or a
  # future step added to this job could fetch vendor/ by accident (or by a
  # cache restore), and a green `cargo build` that had a `vendor/` sitting
  # there proves nothing about a crates.io download. This assertion is what
  # makes the four builds below mean what they claim.
  dict-no-vendor:
    name: fixbolt-dict builds from nothing but the crate itself (no vendor/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: vendor/ must not exist on this runner
        run: |
          if [ -e vendor ]; then
            echo "::error title=vendor/ is present::This job exists to prove fixbolt-dict builds WITHOUT vendor/ (ADR-0104). Something put a vendor/ directory on this runner before this step; find it and remove it rather than trusting this job's green." >&2
            exit 1
          fi
      - run: cargo build -p fixbolt-dict
      - run: cargo build -p fixbolt-dict --features fix50sp2
      - run: cargo build -p fixbolt --no-default-features
      - run: cargo build -p fixbolt-engine --features fix50sp2
      # sha256-only path (no vendor/ to cmp against here) — the other half of
      # this check, the cmp against vendor/, runs in the `gates` job, which
      # does fetch it.
      - run: scripts/check-dict-spec-pin.sh

  # ADR-0160 decision 6: before the first publish, the PACKAGED SOURCES are
  # the stranger. Plan docs/plans/2026-09-23-p3-packaging-and-first-release.md
  # row 6b, ADR-0097 exit criterion 3 ("packaged as it would be at publish
  # time"). `cargo publish --workspace --dry-run` proves the six crates build
  # against EACH OTHER'S packaged sources, but only with DEFAULT features —
  # docs/reference/publishing-a-workspace-to-crates-io.md trap 7 says so in
  # words, and `check-packaged-build.sh` says so by building twelve other
  # combinations from the exact same bytes. Same shape as `dict-no-vendor`
  # above: this job's whole point is a runner that never fetched `vendor/`,
  # because a real crates.io user and docs.rs never see it either.
  package:
    name: The six crates package, dry-run publish, and build from nothing but the .crate contents (no vendor/)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: vendor/ must not exist on this runner
        run: |
          if [ -e vendor ]; then
            echo "::error title=vendor/ is present::This job exists to prove the six crates package and build WITHOUT vendor/ (ADR-0160 decision 6). Something put a vendor/ directory on this runner before this step; find it and remove it rather than trusting this job's green." >&2
            exit 1
          fi
      # ADR-0160 decision 3: `rust-version` — raised from "1.88" to "1.89" by
      # ADR-0154 decision 1, for `File::try_lock` — is prose until something
      # actually builds AT it. `check-packaged-build.sh` names `+1.89.0`
      # explicitly (reference page trap 3's reversal, measured on the
      # then-declared 1.88.0: the same source built on 1.85.0 gives
      # `error[E0658]` in fixbolt-codec's `src/template.rs`, its let chains).
      # Installed here, as a named step, rather than left to rustup's
      # on-demand fetch inside the check script — a missing toolchain is
      # then this step failing, not a swallowed retry three steps later.
      - name: install the declared MSRV (1.89.0) alongside the pinned default
        run: rustup toolchain install 1.89.0 --profile minimal
      # `[measured 2026-09-23]` these scripts are new; nothing else in this
      # file's shellcheck step (lint-config job) names them, and that job is
      # out of scope for this plan step — checked here instead, once, rather
      # than left silently unchecked.
      - run: shellcheck -S info scripts/check-package-contents.sh scripts/check-packaged-build.sh scripts/stranger-check.sh scripts/check-semver-against-tag.sh
      # ADR-0160 decisions 1 and 4, plan row 6a: before anything is packaged,
      # the manifests themselves must be lockstep — every internal normal
      # dependency pinned `=<version>`, every published crate inheriting the
      # workspace version, the two licence files byte-identical. Written at
      # 6a but never wired into CI (senior review of PR #104): a manifest
      # edit that broke this ran green here until now.
      - run: scripts/check-release-versions.sh
      # No --allow-dirty: a real `cargo publish` never gets it either
      # (RELEASING.md step 3), and CI's checkout is clean by construction.
      # This is the step that leaves target/package/<name>-<version>/
      # populated for the three checks below — the exact bytes a `.crate`
      # upload would contain (ADR-0160 decision 6).
      - run: cargo publish --workspace --dry-run
      # Read the `Packaging` / `Verifying` lines above, not only this exit
      # status: what `include` lets through, ADR-0160 decision 4.
      - run: scripts/check-package-contents.sh
      # What the packaged bytes actually build into, over the feature sets a
      # user can pick, on this job's pinned toolchain and on the declared
      # MSRV. Depends on the dry run immediately above having populated
      # target/package/ — it says so itself if that directory is missing.
      - run: scripts/check-packaged-build.sh
      # ADR-0097 exit criterion 7, plan row 8a: the packaged sources, over a
      # real socket, against a client that shares no code with this
      # repository (scripts/stranger-logon.py) — the last, and closest to
      # real, thing this job proves before the owner ever runs `cargo
      # publish` for real. Builds a crate outside this workspace against
      # target/package/ (the dry run above), pastes docs/GETTING-STARTED.md's
      # own code into it verbatim, and drives one Logon/Logout through it.
      - run: scripts/stranger-check.sh --from packaged

  # ADR-0160 decision 7, ADR-0161 decision 5, ADR-0162, plan rows 8b and 8b'
  # (docs/plans/2026-09-23-p3-packaging-and-first-release.md, *Sửa 2* and
  # *Sửa 3*). BLOCKING from the tag `v0.1.0` onward: ADR-0161 decided there is
  # no crates.io upload, so the real API baseline a stranger's `Cargo.lock`
  # sees is the last released tag, not `origin/main`. ADR-0162: that tag is
  # DERIVED, not written here — the newest `vX.Y.Z` tag HEAD descends from,
  # compared as integers — because a literal left at `v0.1.0` after a later
  # tag would make every later version read as a major-level bump, which
  # cargo-semver-checks skips, and the job would stay green comparing
  # nothing. The script's first line names the baseline it chose
  # (`baseline v0.1.0 = highest of: v0.1.0`); read it when this job is
  # green. `scripts/check-semver-against-tag.sh` wraps
  # `cargo semver-checks --workspace --baseline-rev <tag>` and additionally
  # asserts that each of the six published crates actually ran a nonzero
  # count of checks — `[measured 2026-09-24]` an unchanged `0.y.z` version
  # runs the full 196-check lint set, but a `0.y` -> `0.(y+1)` bump is read as
  # a MAJOR change and silently skips every lint while still exiting 0
  # (`0 checks: 0 pass, 254 skip` per crate — first seen at `0.0.0` ->
  # `0.1.0`, before row 6a existed): a gate that trusted the exit status alone
  # would have gone green at exactly the moment nothing was compared. A
  # 0-check crate is excused only when the workspace version is a
  # major-level bump over the baseline by Cargo's rule (`0.1.0` -> `0.2.0`,
  # printed as a NOTE); `0.1.0` -> `0.1.1` with 0 checks is a FAIL (ADR-0162
  # rule 4).
  #
  # Reversal proof for the mechanism itself, `[measured 2026-09-24]`: renaming
  # `fixbolt_codec::checksum::checksum` and comparing an unmodified worktree
  # at the same `0.1.0` against the `v0.1.0` tag read
  # `failure function_missing: pub fn removed or renamed`, named both
  # `fixbolt_codec::checksum::checksum` and its re-export
  # `fixbolt_codec::checksum`, and exited 100 — proving the pinned 0.50.0
  # actually catches the defect class this job exists for. Reversal proof for
  # THIS SCRIPT's own N>0 assertion: adding `--release-type major` to its
  # `cargo semver-checks` invocation reads `FAIL semver: fixbolt-codec ran 0
  # checks against v0.1.0` — the exact silent-skip failure mode above, forced
  # without waiting for a real major bump. Row 8b' reversals of the derived
  # baseline (each in a throwaway `git clone` with its remote removed, never
  # a worktree — a tag made in a worktree is a real tag of this repository)
  # are recorded in the plan's *Nhật ký giao hàng*.
  #
  # `cargo semver-checks --workspace` with no `--exclude`
  # `[measured 2026-09-23]` already checks exactly the six published crates
  # and never mentions `fixbolt-conformance`, `fixbolt-sbe-gen` or
  # `tools/*` — those are `publish = false` (ADR-0160 decision 2) and
  # cargo-semver-checks reads that the same way `cargo publish --workspace`
  # does. No `--exclude` is needed; if a future crate is added without
  # `publish = false` and should stay unchecked, name it here and update
  # docs/reference/publishing-a-workspace-to-crates-io.md.
  #
  # There is no baseline literal to move after a new tag (ADR-0162); only
  # the `stranger-git` job below and the install lines in
  # docs/GETTING-STARTED.md and README.md name a tag (RELEASING.md step 5).
  semver:
    name: cargo-semver-checks against the newest release tag HEAD descends from (blocking, ADR-0162)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          # cargo-semver-checks diffs against a real commit, and
          # scripts/check-semver-against-tag.sh derives the baseline from
          # `git tag --merged HEAD` and reads its Cargo.toml with `git show`;
          # the shallow checkout actions/checkout@v5 takes by default carries
          # neither the tags nor the history they sit on. A checkout missing
          # the NEWEST tag would silently pick an older one — the script's
          # `baseline … = highest of: …` line is where that shows.
          fetch-depth: 0
      - run: cargo install --locked cargo-semver-checks --version 0.50.0
      - run: scripts/check-semver-against-tag.sh

  # ADR-0161 decision 4, plan row 8b. The channel a real stranger actually
  # uses — `cargo add --git <url> --tag v0.1.0` — over the network, from the
  # first pull request opened after the tag exists (the tag is a precondition
  # of both this job and the `semver` job above, not something either one
  # waits to be created). Runs on `pull_request` too, not only `push` to
  # `main` (CLAUDE.md §9 wants a green run id for the closing COMMIT, which
  # for this row is a PR commit; this job also catches a
  # docs/GETTING-STARTED.md edit that starts using API the tagged release
  # does not have yet, before it merges rather than after).
  stranger-git:
    name: A stranger clones fixbolt from GitHub at the v0.1.0 tag and runs it (ADR-0161)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          # scripts/stranger-check.sh's --from git mode verifies the built
          # commit's sha against `git rev-parse v0.1.0^{commit}` IN THIS
          # CHECKOUT — a shallow checkout with no tags would make that
          # verification impossible rather than merely lenient. There is no
          # vendor/-absence step here the way the `package` job has one:
          # `--from git` clones fixbolt fresh from GitHub into its own
          # scratch crate, so a vendor/ directory on THIS runner's checkout
          # has no path into that build at all — asserting its absence would
          # test nothing about this job's mechanism.
          fetch-depth: 0
      - run: scripts/stranger-check.sh --from git --tag v0.1.0

  # PHASE 1 EXIT CRITERION 4, and the only gate in this file with an opinion
  # that did not come from this repository.
  #
  # ADR-0004 decision 5 asked for it before any of the mirroring existed, and
  # named the reason: the mirrored corpus is this project's own reading of a
  # suite written for the other direction, so a wrong reading stays green in it.
  #
  # `[measured 2026-09-02]` on its FIRST run, before it had ever been green,
  # it found that this engine's initiator answered a Logon with a Logon —
  # a defect that made the whole role unusable, and that was green in
  # `--test score` (59/59), in `--test mirror` (0/50, as asserted), in 430 other
  # tests, in clippy, in fmt and in benches/alloc.rs. Six green gates.
  # docs/reference/a-role-can-be-wrong-in-a-direction-no-gate-runs.md.
  #
  # `[2026-09-04]` It runs BOTH directions now. Until then the C++ counterparty
  # only ever judged this engine's initiator, and the acceptor — the product
  # this repository is positioned on — had no evidence but 59 `.def` files read
  # by this repository's own runner. STATUS.md item 42.
  #
  # This job is the only place C++ enters CI. ADR-0004 decision 7 and
  # CLAUDE.md §2 rule 6 both put the bound in the same place: libquickfix lives
  # in CI and in scripts/, never in a Cargo.toml and never on a user's machine.
  # `tools/interop` is ordinary Rust; the no-default-features job runs on its own
  # runner with nothing optional installed and is unaffected by this one.
  #
  # It is BLOCKING. A criterion nobody can fail is not a criterion — PRD.md §2.
  interop:
    name: Both roles, against a real libquickfix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: ws
        run: |
          n=$(cargo metadata --no-deps --format-version 1 | jq '.packages | length')
          echo "count=$n" >> "$GITHUB_OUTPUT"
          if [ "$n" -eq 0 ]; then
            echo "::error title=Nothing to check::cargo metadata reports 0 workspace members — a broken checkout or manifest. STATUS.md open item 26."
            exit 1
          fi
      - run: cmake --version && g++ --version
      - run: scripts/fetch-quickfix-assets.sh
      - name: Build libquickfix, run both ends, read the output
        run: |
          set -o pipefail
          scripts/interop.sh 2>&1 | tee "$RUNNER_TEMP/interop.log"

      # The transcript on the run page, not only in a log somebody has to open.
      # A failure here is five steps failing at once with the cause upstream of
      # all of them — which is exactly what happened the first time — so what is
      # worth reading is BOTH ends, side by side. always(), because a red run is
      # when that matters.
      - if: always()
        name: Publish both transcripts on the run page
        run: |
          {
            echo '## Interop against libquickfix, both directions'
            echo
            echo '### This engine'\''s initiator, and this engine'\''s acceptor'
            echo '```'
            cat "$RUNNER_TEMP/interop.log" 2>/dev/null || echo '(no output)'
            echo '```'
            echo
            echo '### What the C++ acceptor saw'
            echo '```'
            cat vendor/interop-run/acceptor.log 2>/dev/null || echo '(no output)'
            echo '```'
            echo
            echo '### This engine'\''s acceptor'
            echo '```'
            cat vendor/interop-run/fixbolt-acceptor.log 2>/dev/null || echo '(no output)'
            echo '```'
            echo
            echo '### What the C++ initiator saw'
            echo '```'
            cat vendor/interop-run/interop-acceptor.log 2>/dev/null || echo '(no output)'
            echo '```'
            echo
            echo '### The reconnect scenarios: the venue dies and comes back'
            echo
            echo 'STATUS.md item 38. The assertions are read off the C++ acceptor'\''s two'
            echo 'transcripts — before the kill and after it — not off this engine'\''s word.'
            for tag in interop-reconnect interop-reconnect-logout; do
              for half in A1 A2 R; do
                echo
                echo "#### $tag / $half"
                echo '```'
                cat "vendor/interop-run/$tag-$half.log" 2>/dev/null || echo '(no output)'
                echo '```'
              done
            done
            # The FIXT 1.1 arm, both directions. Four transcripts for the same
            # reason the four above are here: under FIXT a failure at logon is
            # a config the counterparty refused, and the only thing that says
            # WHICH of the two dictionaries or the `1137=` spelling it was is
            # the other end's own log. scripts/interop.sh section 4k.
            echo
            echo '### FIXT.1.1 / FIX.5.0SP2, both directions'
            for f in fixbolt-acceptor interop-acceptor acceptor interop-initiator; do
              echo
              echo "#### fixt / $f"
              echo '```'
              cat "vendor/interop-run/fixt/$f.log" 2>/dev/null || echo '(no output)'
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

  # Phase 3 row 9 (docs/plans/2026-09-23-p3-fixp-spike.md), ADR-0140 decision 5. Beyond ADR-0097
  # decision 5's wording ("prove, as a command in CI"), this is the first check anywhere in this
  # repository of fixbolt-sbe's encoder against a decoder Real Logic's own tool generated from a
  # real venue's schema (Artio 0.184's Binary EntryPoint, B3 schema version 5.6) — the SBE interop
  # check PRD.md §2 still lists as unbuilt (`tools/sbe-interop`). That value survives whatever the
  # FIXP ADR (docs/decisions/, number pending) decides about a FIXP session, which this spike does
  # not build (ADR-0078 decision 2, ADR-0097 decision 5).
  #
  # IT IS BLOCKING (ADR-0140 decision 5): a check nobody can fail is not a check — CLAUDE.md §10.
  #
  # scripts/fixp-spike.sh pins 11 jars and one schema file by SHA-256 (fails before compiling or
  # running anything on a mismatch), builds spikes/fixp-probe — a crate detached from this
  # workspace's own `[workspace]` and `exclude` list, so no other job here ever sees it or the
  # fetched schema — and runs three arms against spikes/fixp-probe/referee/Referee.java, our own
  # code on Artio's public API. Aeron needs shared memory (`/dev/shm`, present on GitHub-hosted
  # runners by default) and two localhost UDP ports for its Archive control/response streams
  # (10010/10020, the script's own defaults) — the plan's stated risk if that ever proves flaky
  # here. Every other port is a fresh one the kernel hands out per arm (scripts/fixp-spike.sh
  # `pick_port`), never a fixed number: `scripts/interop-qfj.sh` on a sibling branch already owns
  # 15660-15663 for its own fixed acceptors, and this job must not collide with it.
  #
  # ONLY THE PRINTED SUMMARY LINE DECIDES (CLAUDE.md §7, §10: read the output, not the exit
  # status), so the grep below is its own step, separate from the run that produced the log —
  # ADR-0140 decision 6's two refusal arms exist so a referee that has only ever said yes proves
  # nothing, and row 4's reversal G (a summary grep with the wrong pattern) must go red on this
  # exact green log, not just on a broken run.
  fixp-spike:
    name: FIXP spike — fixbolt-sbe against Artio's Binary EntryPoint (blocking, ADR-0140)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: python3 is present (the fresh-port picker scripts/fixp-spike.sh's pick_port uses)
        run: python3 --version
      - name: Pin, fetch, build and run all three arms; read the transcript, not the exit code alone
        run: |
          set -o pipefail
          scripts/fixp-spike.sh 2>&1 | tee "$RUNNER_TEMP/fixp-spike.log"

      # A step of its own, on the log the step above already captured — a run that exits 0 without
      # ever printing the summary line (or that prints a near-miss) must still fail this job.
      - name: The summary line is what decides, not the exit code above
        run: |
          if ! grep -qxF 'fixp-spike: accept PASS 5/5, reject-timestamp PASS, reject-credentials PASS' "$RUNNER_TEMP/fixp-spike.log"; then
            echo "::error title=fixp-spike did not print its summary line::scripts/fixp-spike.sh's transcript, published below on failure, has no exact match for the line all three arms must produce together. See ADR-0140 decision 5 and docs/CONFORMANCE.md's FIXP spike section."
            exit 1
          fi

      # The probe is outside the workspace, so the workspace clippy job never lints it, and the
      # lint table copied into spikes/fixp-probe/Cargo.toml would be a claim nobody runs (review of
      # PR #102). It runs here, after the step above has fetched the schema its build.rs needs.
      - name: Lint the detached probe with its own copy of the workspace lint table
        run: cargo clippy --locked --manifest-path spikes/fixp-probe/Cargo.toml --all-targets -- -D warnings

      # Only on failure — the run above already tees the log to this step's own reader on a green
      # run, and CLAUDE.md §7 asks for the output to be read, not archived unconditionally.
      - if: failure()
        name: Publish the transcript on the run page
        run: |
          {
            echo '## FIXP spike transcript'
            echo
            echo '```'
            cat "$RUNNER_TEMP/fixp-spike.log" 2>/dev/null || echo '(no output)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ADR-0097 exit criterion 6, ADR-0130. `libquickfix` above is one independent opinion;
  # QuickFIX/J is a second family entirely — a JVM, a different codebase — judging this engine
  # in BOTH roles, plaintext AND TLS, which the criterion's own wording asks for and `interop`
  # never has (its TLS side has no counterparty but this engine itself). `scripts/interop-qfj.sh`
  # fetches six jars pinned by SHA-256 into gitignored vendor/quickfixj/, compiles this
  # repository's own judge (`tools/interop-qfj/Judge.java`, QuickFIX/J's public API only,
  # non-negotiable 9), and runs four arms: this engine as acceptor and as initiator (`--role
  # dial`, the real engine door, not the pure session `interop` above drives), each in plaintext
  # and over kTLS. The two TLS arms need a runner that can offload TLS, which `interop` never
  # asks for — so this job asks first, in its own words, exactly as the `tls` job above does.
  #
  # BLOCKING, same reasoning as `interop`: a criterion nobody can fail is not a criterion —
  # PRD.md §2.
  interop-qfj:
    name: Both roles, plaintext and TLS, against QuickFIX/J
    runs-on: ubuntu-latest
    # A hung arm must end as a red job, not as six hours of runner. Every wait in the script is
    # bounded (DEADLINE, the 40 s dial stop), so a green run is minutes; 20 is the ceiling the
    # senior review of PR #100 named, with room for a cold `cargo build --features tls`.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      # Copied from the `tls` job above: an environment that cannot offload TLS must fail in its
      # own words, not as a `kernel` assertion inside scripts/interop-qfj.sh that reads like an
      # engine defect.
      - name: This runner must be able to offload TLS
        run: |
          verdict="$(scripts/check-ktls-available.sh | tail -n +1 | grep -E '^(READY|NOT_BUILT|OTHER|NOT_LOADED)' | head -1)"
          echo "verdict: ${verdict:-<none>}"
          if [ "$verdict" != "READY" ]; then
            echo "::error title=This runner cannot offload TLS::scripts/check-ktls-available.sh did not say READY. The two TLS arms of scripts/interop-qfj.sh assert that the kernel took the keys, and on this runner that cannot mean anything. This is the environment, not the engine — see the tls job's own step above."
            exit 1
          fi
      # tools/interop needs vendor/ to build (dict's generated tables read the FIX44.xml this
      # pins) — the same reason the `interop` job above runs it before scripts/interop.sh.
      - run: scripts/fetch-quickfix-assets.sh
      - name: Fetch QuickFIX/J, run four arms, read the output
        run: |
          set -o pipefail
          scripts/interop-qfj.sh 2>&1 | tee "$RUNNER_TEMP/interop-qfj.log"
      # CLAUDE.md §10: a check proves nothing until something reads it. The script itself already
      # exits non-zero on any missed step or assertion, but this step is what a future edit to it
      # is held against — an edit that let it exit 0 without ever printing the four-arm line would
      # otherwise pass silently. Plan reversal G: misspell one number in the pattern below and
      # this step must go red even on an unmodified, green script run.
      - name: Assert the summary line
        run: |
          grep -qE '^interop-qfj: 7 / 7 acceptor plain \+ 7 / 7 acceptor TLS \+ 7 / 7 initiator plain \+ 7 / 7 initiator TLS' "$RUNNER_TEMP/interop-qfj.log"

      - if: always()
        name: Publish every transcript on the run page
        run: |
          {
            echo '## Interop against QuickFIX/J, both roles, plaintext and TLS'
            echo
            echo '```'
            cat "$RUNNER_TEMP/interop-qfj.log" 2>/dev/null || echo '(no output)'
            echo '```'
            for label in qfj-acceptor-plain qfj-acceptor-tls qfj-initiator-plain qfj-initiator-tls; do
              echo
              echo "### ${label}"
              echo
              echo '#### fixbolt'
              echo '```'
              cat "vendor/interop-qfj-run/${label}/fixbolt.log" 2>/dev/null || echo '(no output)'
              echo '```'
              echo
              echo '#### the judge'
              echo '```'
              cat "vendor/interop-qfj-run/${label}/judge.log" 2>/dev/null || echo '(no output)'
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

  # STATUS.md open item 20. Eight bench targets asserted ceilings and counts —
  # and a ninth that Cargo had auto-discovered from benches/harness.rs, which
  # contains no case and reported "0 measured", exit 0. NOTHING RAN ANY OF THEM: `cargo test --all` does not run a `harness = false` bench
  # target — measured 2026-08-30, 43 test binaries, not one of them a bench — and
  # no job here called `cargo bench`. That included `benches/alloc.rs`, which
  # CLAUDE.md §2 names as the machine check for non-negotiable 1, so the
  # "machine-checked today" list was naming a check nothing invoked.
  #
  # This job is BLOCKING, and what blocks it is deliberate. scripts/bench.sh
  # fails on a machine-independent benchmark (allocation counts, ring counts)
  # and on a target that produced no measurement; it reports a timing ceiling
  # rather than failing on it, because `[measured 2026-08-30]` the same case
  # swings 5-232% run to run on a shared runner and three of twelve flip colour
  # between runs. A gate that goes red at random gets switched off, and the
  # ceilings are M5-tuned besides — DESIGN.md §6.
  #
  # Do NOT add continue-on-error here. It would take non-negotiable 1 back to
  # having no machine check at all, which is the state this job ends.
  bench:
    name: Benchmarks run, and the machine-independent ones must pass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: ws
        run: |
          n=$(cargo metadata --no-deps --format-version 1 | jq '.packages | length')
          echo "count=$n" >> "$GITHUB_OUTPUT"
          if [ "$n" -eq 0 ]; then
            echo "::error title=Nothing to check::cargo metadata reports 0 workspace members — a broken checkout or manifest. STATUS.md open item 26."
            exit 1
          fi
      - run: scripts/fetch-quickfix-assets.sh
      - name: Run every benchmark
        run: |
          set -o pipefail
          scripts/bench.sh 2>&1 | tee "$RUNNER_TEMP/bench.log"

      # The figures go on the run's own page, not only into a log somebody has
      # to go looking for. CLAUDE.md §10: a check proves nothing until something
      # reads it, and an advisory number nobody reads is the defect this job is
      # fixing, one layer up. always(), because a failed run is exactly when the
      # numbers are worth reading.
      - if: always()
        name: Publish the figures on the run page
        run: |
          {
            echo '## Benchmarks'
            echo
            echo 'Timing ceilings are tuned to an Apple M5 and this is a shared runner;'
            echo 'they are published here, not enforced. See DESIGN.md §6.'
            echo
            echo '```'
            cat "$RUNNER_TEMP/bench.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
