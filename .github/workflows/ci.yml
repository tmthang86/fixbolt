# The gates CLAUDE.md §2 and DESIGN.md §6 name. Until this file existed, "CI
# proves it" appeared in eight places across the documentation and nothing ran.
#
# One rule governs this file: a green run must mean something was checked. The
# workspace has no crates yet, so the crate-dependent gates cannot run — they
# are skipped with a visible annotation rather than passed silently.
name: CI

# Every branch, not only main. CLAUDE.md §8 says implementation happens on a
# branch per plan and "gates must be green FOR THAT COMMIT, not merely for the
# branch tip" — which a main-only trigger cannot deliver, because it first sees
# the work after the merge.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # No global RUSTFLAGS: -D warnings here. The clippy step already denies them,
  # and a global setting would split cargo's build cache between the clippy and
  # test steps for no extra coverage — and would leak into the temp crate that
  # scripts/check-lint-config.sh builds.

jobs:
  # The one gate that is meaningful today, and the only one that does not
  # depend on a crate existing. It proves by reversal that the workspace lint
  # configuration actually denies unwrap/expect/panic — CLAUDE.md §2 rule 7.
  lint-config:
    name: Lint config enforces non-negotiable 7
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup component add clippy
      - run: scripts/check-lint-config.sh

  # `[measured 2026-08-30]` scripts/check-ktls-available.sh printed
  # `config: CONFIG_TLS=m` and then "it was built without CONFIG_TLS" in the SAME
  # run, and STATUS.md open item 10 stayed blocked on that sentence for a day.
  # Nothing could have caught it: the script was a gate nothing gated. The
  # classification is pure logic, so it is checked here on every push, on a runner
  # whose own kernel state is irrelevant to the result.
  #
  # check-machine-verdicts.sh is here for the same reason and a sharper one: its
  # `not virtualised` row decides whether the OTHER §9 rows can mean anything, and
  # this repository has no VM to test it against. A guest does not fail governor,
  # turbo, C-states or SMT loudly — the files are simply absent — so it reads as
  # under-configured rather than as structurally unable. THIS RUNNER IS A GUEST,
  # so the bench job's machine block now says so on every run.
  script-logic:
    name: The machine probes reach the right verdicts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: scripts/check-ktls-classify.sh
      - run: scripts/check-machine-verdicts.sh

  # Also meaningful today: this repository is 17 markdown files and has already
  # shipped dead links twice, both found by hand.
  links:
    name: No dead internal links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: scripts/check-links.py

  # rustdoc is the front door of a Rust crate — docs.rs is where a user lands
  # before the README. A broken intra-doc link there is a dead link the `links`
  # job cannot see, because it is inside a doc comment, not a markdown file.
  # `[measured 2026-09-03]` this job was red on arrival: 13 pre-existing warnings,
  # including public docs linking to private items. The-doc-set plan, step B6.
  docs:
    name: rustdoc has no broken intra-doc links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # cargo doc compiles the crates, and fixbolt-dict generates its tables from
      # the QuickFIX XML at build time, so vendor/ must be present first.
      - run: scripts/fetch-quickfix-assets.sh
      - run: RUSTDOCFLAGS="-D rustdoc::broken_intra_doc_links -D rustdoc::redundant_explicit_links" cargo doc --workspace --no-deps

  gates:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup component add rustfmt clippy

      - id: ws
        name: How many crates are there to check?
        run: |
          n=$(cargo metadata --no-deps --format-version 1 | jq '.packages | length')
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "Workspace members: $n"
          if [ "$n" -eq 0 ]; then
            echo "::error title=Nothing to check::cargo metadata reports 0 workspace members. This workspace holds six crates, so zero means a broken checkout or a broken manifest — not an empty repository. Failing rather than passing on nothing: CLAUDE.md §10, a green result that was inferred rather than observed is not a result. STATUS.md open item 26."
            exit 1
          fi

      # fixbolt-dict generates its tables from the QuickFIX XML at build time and
      # fails the build when it is absent — deliberately, see crates/dict/build.rs.
      # vendor/ is gitignored (ADR-0001), so CI fetches it before anything builds.
      - run: scripts/fetch-quickfix-assets.sh

      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all

      # `affinity` is off by default and Linux-only (ADR-0015 decision 9), so
      # the two steps above never compile a line of it. Without this the module
      # and its five tests would be a gate nothing gates — the shape this
      # repository keeps paying for: see the kTLS diagnostic that contradicted
      # its own output for a day, and check-lint-config.sh, which was red on the
      # developer machine and green here.
      #
      # The second command is the combination nothing else covers: `affinity`
      # WITHOUT `standard`. Both take the same optional `libc`, so a mistake in
      # how that dependency is shared only shows up when one feature is on and
      # the other is off.
      - name: The affinity feature builds, lints and passes on its own
        run: |
          cargo clippy --all-targets --features affinity -- -D warnings
          cargo test -p fixbolt-engine --features affinity
          cargo test -p fixbolt-engine --no-default-features --features affinity

  # STATUS.md open item 19. `rust-toolchain.toml` pins the toolchain so that a
  # clippy release cannot turn this repository red with no commit behind it —
  # `[measured 2026-08-30]` clippy::byte_char_slices did exactly that. Pinning
  # alone would only trade that surprise for a slow drift, so this job runs the
  # NEWEST stable and is allowed to fail: the next such lint arrives here as a
  # warning to read, at the time it appears, instead of as a red morning later.
  #
  # continue-on-error is the whole point. If this job is ever made blocking, the
  # pin stops being a pin and item 19 is back.
  clippy-latest-stable:
    name: clippy on the newest stable (advisory, never blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - id: ws
        run: |
          n=$(cargo metadata --no-deps --format-version 1 | jq '.packages | length')
          echo "count=$n" >> "$GITHUB_OUTPUT"
          if [ "$n" -eq 0 ]; then
            echo "::error title=Nothing to check::cargo metadata reports 0 workspace members — a broken checkout or manifest. STATUS.md open item 26."
            exit 1
          fi
      - run: rustup toolchain install stable --profile minimal --component clippy
      - run: |
          echo "pinned:  $(cargo --version)"
          echo "newest:  $(cargo +stable --version)"
      - run: scripts/fetch-quickfix-assets.sh
      - run: cargo +stable clippy --all-targets -- -D warnings

  # CLAUDE.md §2 non-negotiable 4: the engine thread never sleeps in the kernel.
  # STATUS.md open item 15, which had no machine check at all until 2026-08-30 —
  # two attempts to build one both reported success while a sleep was present.
  #
  # This one traces a real binary and requires its own RED half to fail, so a
  # green here cannot mean "the check is broken".
  no-kernel-sleep:
    name: The engine thread never sleeps in the kernel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: ws
        run: |
          n=$(cargo metadata --no-deps --format-version 1 | jq '.packages | length')
          echo "count=$n" >> "$GITHUB_OUTPUT"
          if [ "$n" -eq 0 ]; then
            echo "::error title=Nothing to check::cargo metadata reports 0 workspace members — a broken checkout or manifest. STATUS.md open item 26."
            exit 1
          fi
      - run: sudo apt-get update && sudo apt-get install -y strace
      - run: scripts/fetch-quickfix-assets.sh
      - run: cargo build -p fixbolt-w2w --release
      - run: scripts/check-no-kernel-sleep.sh

      # `[2026-09-02]` `--path app` — `NewOrderSingle` -> `ExecutionReport`,
      # the path DESIGN.md §8's table is actually about — is new, and the gate
      # above drives only `--path admin`. So it is run here once, small, for its
      # own three assertions rather than for a timing figure: the reply must be
      # a `35=8`, it must carry the ClOrdID that was just sent, and the timed
      # window must allocate nothing. All three are inside the binary and fire
      # per message, so a runner with no isolated cores is a perfectly good
      # place to check them; only the nanoseconds need §9, and this step reads
      # none.
      - name: The app path's own oracle, on every message
        run: |
          ./target/release/w2w --path app --messages 500 --warmup 100 | tee /tmp/app.txt
          grep -q 'allocs *0 ' /tmp/app.txt
          grep -q 'NewOrderSingle -> ExecutionReport' /tmp/app.txt

      # The mirror of the `standard` lesson in tools/w2w/Cargo.toml: a flag that
      # is accepted and does nothing is worse than one that is refused. Without
      # `--features affinity` this build CANNOT pin, so `--engine-core` must be
      # an error — and a green here is the only thing standing between a future
      # run and a figure labelled §9 that never pinned a thread.
      - name: A build that cannot pin refuses --engine-core
        run: |
          if ./target/release/w2w --engine-core 0 --messages 10 --warmup 2; then
            echo "::error title=A flag that does nothing::--engine-core was accepted by a build with no affinity feature"
            exit 1
          fi

  # CLAUDE.md §2 non-negotiable 4, SECOND HALF: in `standard` mode the engine
  # thread must block when idle and give the core back. ADR-0013 decision 6
  # asked for it; until this job existed rule 4 was half-enforced and
  # CLAUDE.md's own machine-checked list said so.
  #
  # It asserts four things because CPU near zero is passable by an engine that
  # is broken in three different ways — a dead thread, a run that never reached
  # the mode it was asked for, and an engine woken by its own 100 ms timeout
  # rather than by the data. `[measured 2026-08-30]` that last one is not
  # hypothetical: with `Block` made to ignore readiness the p50 goes to
  # 99 046 599 ns, one whole timeout, while CPU stays at 0% and the thread is
  # found sleeping 20 times out of 20. Two of the four assertions pass and only
  # the fourth catches it.
  #
  # And it requires its own red halves to fail, on the POLICY rather than on a
  # broken measurement — the two are separate exit codes for a reason.
  standard-blocks:
    name: A standard engine gives the core back
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: ws
        run: |
          n=$(cargo metadata --no-deps --format-version 1 | jq '.packages | length')
          echo "count=$n" >> "$GITHUB_OUTPUT"
          if [ "$n" -eq 0 ]; then
            echo "::error title=Nothing to check::cargo metadata reports 0 workspace members — a broken checkout or manifest. STATUS.md open item 26."
            exit 1
          fi
      - run: scripts/fetch-quickfix-assets.sh
      - run: cargo build -p fixbolt-w2w --release
      - run: scripts/check-standard-gives-the-core-back.sh

  # CLAUDE.md §2 non-negotiable 6: this must build on a machine with nothing
  # optional installed. Its own runner, so it cannot inherit anything a
  # previous step put there.
  no-default-features:
    name: Builds with nothing optional installed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: ws
        run: |
          n=$(cargo metadata --no-deps --format-version 1 | jq '.packages | length')
          echo "count=$n" >> "$GITHUB_OUTPUT"
          if [ "$n" -eq 0 ]; then
            echo "::error title=Nothing to check::cargo metadata reports 0 workspace members — a broken checkout or manifest. STATUS.md open item 26."
            exit 1
          fi
      - run: scripts/fetch-quickfix-assets.sh
      - run: cargo test --all --no-default-features

      # `[measured 2026-08-30]` THE STEP ABOVE DOES NOT PROVE WHAT IT READS AS,
      # and on its own this job was green about a build that never happened.
      # `--no-default-features` applies to the invocation, and cargo unifies
      # features across everything in it — so `tools/w2w`, a workspace member
      # depending on `fixbolt-engine` with defaults on, switched the `standard`
      # feature back on for the whole build and `libc` was compiled anyway.
      # The flag under test was turned back on by a sibling crate.
      #
      # Asking per crate is the only scope where the flag means what it says.
      # See docs/reference/feature-flags-unify-across-a-workspace.md.
      - run: scripts/check-no-optional-deps.sh

  # PHASE 1 EXIT CRITERION 4, and the only gate in this file with an opinion
  # that did not come from this repository.
  #
  # ADR-0004 decision 5 asked for it before any of the mirroring existed, and
  # named the reason: the mirrored corpus is this project's own reading of a
  # suite written for the other direction, so a wrong reading stays green in it.
  #
  # `[measured 2026-09-02]` on its FIRST run, before it had ever been green,
  # it found that this engine's initiator answered a Logon with a Logon —
  # a defect that made the whole role unusable, and that was green in
  # `--test score` (59/59), in `--test mirror` (0/50, as asserted), in 430 other
  # tests, in clippy, in fmt and in benches/alloc.rs. Six green gates.
  # docs/reference/a-role-can-be-wrong-in-a-direction-no-gate-runs.md.
  #
  # `[2026-09-04]` It runs BOTH directions now. Until then the C++ counterparty
  # only ever judged this engine's initiator, and the acceptor — the product
  # this repository is positioned on — had no evidence but 59 `.def` files read
  # by this repository's own runner. STATUS.md item 42.
  #
  # This job is the only place C++ enters CI. ADR-0004 decision 7 and
  # CLAUDE.md §2 rule 6 both put the bound in the same place: libquickfix lives
  # in CI and in scripts/, never in a Cargo.toml and never on a user's machine.
  # `tools/interop` is ordinary Rust; the no-default-features job runs on its own
  # runner with nothing optional installed and is unaffected by this one.
  #
  # It is BLOCKING. A criterion nobody can fail is not a criterion — PRD.md §2.
  interop:
    name: Both roles, against a real libquickfix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: ws
        run: |
          n=$(cargo metadata --no-deps --format-version 1 | jq '.packages | length')
          echo "count=$n" >> "$GITHUB_OUTPUT"
          if [ "$n" -eq 0 ]; then
            echo "::error title=Nothing to check::cargo metadata reports 0 workspace members — a broken checkout or manifest. STATUS.md open item 26."
            exit 1
          fi
      - run: cmake --version && g++ --version
      - run: scripts/fetch-quickfix-assets.sh
      - name: Build libquickfix, run both ends, read the output
        run: |
          set -o pipefail
          scripts/interop.sh 2>&1 | tee "$RUNNER_TEMP/interop.log"

      # The transcript on the run page, not only in a log somebody has to open.
      # A failure here is five steps failing at once with the cause upstream of
      # all of them — which is exactly what happened the first time — so what is
      # worth reading is BOTH ends, side by side. always(), because a red run is
      # when that matters.
      - if: always()
        name: Publish both transcripts on the run page
        run: |
          {
            echo '## Interop against libquickfix, both directions'
            echo
            echo '### This engine'\''s initiator, and this engine'\''s acceptor'
            echo '```'
            cat "$RUNNER_TEMP/interop.log" 2>/dev/null || echo '(no output)'
            echo '```'
            echo
            echo '### What the C++ acceptor saw'
            echo '```'
            cat vendor/interop-run/acceptor.log 2>/dev/null || echo '(no output)'
            echo '```'
            echo
            echo '### This engine'\''s acceptor'
            echo '```'
            cat vendor/interop-run/fixbolt-acceptor.log 2>/dev/null || echo '(no output)'
            echo '```'
            echo
            echo '### What the C++ initiator saw'
            echo '```'
            cat vendor/interop-run/interop-acceptor.log 2>/dev/null || echo '(no output)'
            echo '```'
            echo
            echo '### The reconnect scenarios: the venue dies and comes back'
            echo
            echo 'STATUS.md item 38. The assertions are read off the C++ acceptor'\''s two'
            echo 'transcripts — before the kill and after it — not off this engine'\''s word.'
            for tag in interop-reconnect interop-reconnect-logout; do
              for half in A1 A2 R; do
                echo
                echo "#### $tag / $half"
                echo '```'
                cat "vendor/interop-run/$tag-$half.log" 2>/dev/null || echo '(no output)'
                echo '```'
              done
            done
          } >> "$GITHUB_STEP_SUMMARY"

  # STATUS.md open item 20. Eight bench targets asserted ceilings and counts —
  # and a ninth that Cargo had auto-discovered from benches/harness.rs, which
  # contains no case and reported "0 measured", exit 0. NOTHING RAN ANY OF THEM: `cargo test --all` does not run a `harness = false` bench
  # target — measured 2026-08-30, 43 test binaries, not one of them a bench — and
  # no job here called `cargo bench`. That included `benches/alloc.rs`, which
  # CLAUDE.md §2 names as the machine check for non-negotiable 1, so the
  # "machine-checked today" list was naming a check nothing invoked.
  #
  # This job is BLOCKING, and what blocks it is deliberate. scripts/bench.sh
  # fails on a machine-independent benchmark (allocation counts, ring counts)
  # and on a target that produced no measurement; it reports a timing ceiling
  # rather than failing on it, because `[measured 2026-08-30]` the same case
  # swings 5-232% run to run on a shared runner and three of twelve flip colour
  # between runs. A gate that goes red at random gets switched off, and the
  # ceilings are M5-tuned besides — DESIGN.md §6.
  #
  # Do NOT add continue-on-error here. It would take non-negotiable 1 back to
  # having no machine check at all, which is the state this job ends.
  bench:
    name: Benchmarks run, and the machine-independent ones must pass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: ws
        run: |
          n=$(cargo metadata --no-deps --format-version 1 | jq '.packages | length')
          echo "count=$n" >> "$GITHUB_OUTPUT"
          if [ "$n" -eq 0 ]; then
            echo "::error title=Nothing to check::cargo metadata reports 0 workspace members — a broken checkout or manifest. STATUS.md open item 26."
            exit 1
          fi
      - run: scripts/fetch-quickfix-assets.sh
      - name: Run every benchmark
        run: |
          set -o pipefail
          scripts/bench.sh 2>&1 | tee "$RUNNER_TEMP/bench.log"

      # The figures go on the run's own page, not only into a log somebody has
      # to go looking for. CLAUDE.md §10: a check proves nothing until something
      # reads it, and an advisory number nobody reads is the defect this job is
      # fixing, one layer up. always(), because a failed run is exactly when the
      # numbers are worth reading.
      - if: always()
        name: Publish the figures on the run page
        run: |
          {
            echo '## Benchmarks'
            echo
            echo 'Timing ceilings are tuned to an Apple M5 and this is a shared runner;'
            echo 'they are published here, not enforced. See DESIGN.md §6.'
            echo
            echo '```'
            cat "$RUNNER_TEMP/bench.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
