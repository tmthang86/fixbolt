[workspace]
resolver = "3"
members = [
    "crates/codec",
    "crates/conformance",
    "crates/dict",
    "crates/engine",
    "crates/library",
    "crates/session",
    "tools/attr-scan",
    "tools/interop",
    "tools/jrnl",
    "tools/w2w",
]
# fuzz/ needs nightly and is its own workspace. Excluded so `cargo build` at the
# root, and CI's --no-default-features job, never try to build it on stable.
#
# spikes/ is excluded for the same shape of reason and a sharper one: a spike
# answers a question and is not shipped, and CLAUDE.md §2 rule 6 requires the
# --no-default-features job to run on a machine with nothing optional installed.
# spikes/ktls pulls rustls and ring; cargo unifies features across one
# invocation, and this repository has already been burned once by exactly that
# (docs/reference/feature-flags-unify-across-a-workspace.md).
exclude = ["fuzz", "spikes/ktls"]

# Crates are added one at a time, each behind an approved plan in docs/plans/.
# See CLAUDE.md §1 — Rule Zero.

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tmthang86/fixbolt"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
# priority = -1 is required. Without it cargo refuses the config outright:
# "lint group `all` has the same priority (0) as a lint".
all = { level = "warn", priority = -1 }

# CLAUDE.md §2 non-negotiable 7. These are `clippy::restriction` lints and are
# NOT part of `clippy::all` — measured 2026-08-28: with `all` alone, a library
# crate containing unwrap(), expect() and panic!() passed
# `cargo clippy --all-targets -- -D warnings` with exit 0. The rule was prose.
# scripts/check-lint-config.sh proves these by reversal, and CI runs it.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# The fourth, added 2026-09-08, and it is the one that would have caught the
# bug the other three could not see. `[measured 2026-09-06]` a ring dispatch
# record gained a field between two existing ones and
# `fixed[OUT_SEQ..OUT_LAST_PROCESSED]` went from four bytes to five in silence;
# `copy_from_slice` then panicked **in a library crate** — non-negotiable 7's
# exact subject, and invisible to `unwrap_used`, `expect_used` and `panic`,
# because `a[i..j]` names none of them. Four `dispatch` tests caught it and
# nothing else could have.
#
# `[measured 2026-09-08]` 207 sites in `crates/*/src` on the day this line was
# written, across 21 files, each of which carries a `#![allow]` with its own
# count. **The allow is not the mechanism.** `scripts/check-indexing-debt.sh`
# counts with `--force-warn`, which overrides every one of those allows, and
# fails when the total moves in the wrong direction — so new code in a clean
# file is stopped by this line, and new code in a file that still owes is
# stopped by the ceiling. STATUS.md item 55, open until the ceiling reaches 0.
indexing_slicing = "deny"
