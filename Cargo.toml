[workspace]
resolver = "3"
members = [
    "crates/codec",
    "crates/conformance",
    "crates/dict",
    "crates/engine",
    "crates/session",
]
# fuzz/ needs nightly and is its own workspace. Excluded so `cargo build` at the
# root, and CI's --no-default-features job, never try to build it on stable.
exclude = ["fuzz"]

# Crates are added one at a time, each behind an approved plan in docs/plans/.
# See CLAUDE.md §1 — Rule Zero.

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tmthang86/nanofixengine"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
# priority = -1 is required. Without it cargo refuses the config outright:
# "lint group `all` has the same priority (0) as a lint".
all = { level = "warn", priority = -1 }

# CLAUDE.md §2 non-negotiable 7. These are `clippy::restriction` lints and are
# NOT part of `clippy::all` — measured 2026-08-28: with `all` alone, a library
# crate containing unwrap(), expect() and panic!() passed
# `cargo clippy --all-targets -- -D warnings` with exit 0. The rule was prose.
# scripts/check-lint-config.sh proves these by reversal, and CI runs it.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
