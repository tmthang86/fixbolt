[package]
name = "fixbolt-codec"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "FIX 4.4 parse and serialise in place, no allocation on the hot path"
readme = "README.md"
keywords = ["fix", "fix-protocol", "parser", "zero-copy", "trading"]
categories = ["finance", "parser-implementations", "encoding", "no-std"]
# ADR-0160 decision 4: an allowlist. Tests and benches are not shipped — their
# path-only dev-dependencies are stripped from the `.crate` and half of them
# read `vendor/`, so they cannot build from it.
include = ["src/**", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]
# benches/harness.rs is a module the bench targets include by #[path], not a
# bench. Cargo's autodiscovery made it a target of its own: `cargo bench --bench
# harness` reported "0 measured" and exited 0 — a green result from a target
# that measures nothing. Every real bench is declared below, so discovery is off.
autobenches = false

# Pass-through only, and **dev-only in effect**: this crate compiles no table of
# its own and `fixbolt-dict` is a dev-dependency here. The feature exists so
# `benches/alloc.rs` can name `Fixt11Fix50Sp2Tables` under a flag of this
# package's own — a bench that only measures when some *other* crate happens to
# be in the same cargo invocation is a bench nobody can run
# (docs/reference/feature-flags-unify-across-a-workspace.md).
[features]
fix50sp2 = ["fixbolt-dict/fix50sp2"]

[dev-dependencies]
# A dev-dependency cycle: dict depends on codec, and codec's TESTS depend on
# dict. Cargo permits exactly this shape, and it is the only way to test the
# parser against the real generated dictionary without duplicating the loader.
fixbolt-dict = { path = "../dict" }
# A dev-dependency cycle, which cargo permits: conformance depends on codec.
# The codec's tests read the `.def` corpus through conformance's loader, because
# a second loader would be a second place for a rule that has one.
fixbolt-conformance = { path = "../conformance" }

[[bench]]
name = "parse"
harness = false

[[bench]]
name = "serialize"
harness = false

[[bench]]
name = "groups"
harness = false

[[bench]]
name = "alloc"
harness = false

[[bench]]
name = "decimal"
harness = false

[lints]
workspace = true

# ADR-0160 decision 8: docs.rs builds a named feature list, never
# `all-features`. docs.rs passes `--cfg docsrs` itself, which turns on
# `feature(doc_cfg)` at the crate root so each gated item shows its feature.
[package.metadata.docs.rs]
# Defaults only. `fix50sp2` here is dev-only (it reaches `fixbolt-dict`, a
# dev-dependency) and cargo publishes it as an empty feature.
features = []
