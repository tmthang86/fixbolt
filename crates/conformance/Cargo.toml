[package]
name = "nanofix-conformance"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Runs the QuickFIX FIX 4.4 session acceptance definitions in-process, against a pure session machine"

# Zero runtime dependencies, like `codec`. The plan named none, and nothing here
# needs one: the five loosely-matched tags are shape checks over ASCII digits,
# not a regex language.
[dependencies]
nanofix-codec = { path = "../codec" }
nanofix-dict = { path = "../dict" }

[lints]
workspace = true
