[package]
name = "fixbolt"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The application-facing API: a handler, a reply, and one place to depend on"
readme = "README.md"
keywords = ["fix", "fix-protocol", "acceptor", "low-latency", "trading"]
categories = ["finance", "network-programming"]
# ADR-0160 decision 4: an allowlist. Tests and benches are not shipped — their
# path-only dev-dependencies are stripped from the `.crate` and half of them
# read `vendor/`, so they cannot build from it.
include = ["src/**", "examples/**", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

# `DESIGN.md` §3 L4. This crate has a `[features]` block and `tools/jrnl` does
# not, and the difference is the rule rather than an inconsistency: `jrnl` reads
# a file and branches on nothing, while this crate re-exports `serve`, which is
# `#[cfg(all(feature = "standard", unix))]` in `engine`. A `cfg` never reaches
# into a dependency's features, so the mode has to be named here too — and
# non-negotiable 6 then requires the `#[cfg]` on the `pub use` itself, not only
# in this manifest. `crates/library/src/lib.rs` carries it.
#
# The consequence is the same one ADR-0014 gave `engine`, and it is worth
# having: `--no-default-features` builds this crate with NO dependency on `libc`
# and no `unsafe` anywhere in the tree. `scripts/check-no-optional-deps.sh` has
# a case for it.
[features]
default = ["standard"]
standard = ["fixbolt-engine/standard"]
# ADR-0078, ADR-0082 decision 4. SBE is a codec without a session: this feature
# re-exports `fixbolt-sbe` and nothing else changes — `standard`'s `serve*` and
# this feature are independent. Not default, and gated on the `mod`/`pub use`
# itself in `lib.rs` (CLAUDE.md §2 rule 6), so `--no-default-features` never
# names `fixbolt-sbe`. `scripts/check-no-optional-deps.sh` has the case
# `fixbolt:fixbolt-sbe`.
sbe = ["dep:fixbolt-sbe"]

[dependencies]
fixbolt-codec = { version = "=0.1.0", path = "../codec" }
fixbolt-dict = { version = "=0.1.0", path = "../dict" }
fixbolt-engine = { version = "=0.1.0", path = "../engine", default-features = false }
fixbolt-sbe = { version = "=0.1.0", path = "../sbe", optional = true, default-features = false, features = [
    "encoding",
] }
fixbolt-session = { version = "=0.1.0", path = "../session" }

[lints]
workspace = true

[[bench]]
name = "alloc"
harness = false

[[bench]]
name = "cost"
harness = false

[[example]]
name = "sbe_decode"
required-features = ["sbe"]

# ADR-0160 decision 8: docs.rs builds a named feature list, never
# `all-features`. docs.rs passes `--cfg docsrs` itself, which turns on
# `feature(doc_cfg)` at the crate root so each gated item shows its feature.
[package.metadata.docs.rs]
features = ["standard", "sbe"]
