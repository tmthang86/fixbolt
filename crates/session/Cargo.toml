[package]
name = "fixbolt-session"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The FIX 4.4 session state machine. Pure: no socket, no clock, no allocation"
readme = "README.md"
keywords = ["fix", "fix-protocol", "session", "state-machine", "trading"]
categories = ["finance", "network-programming"]
# ADR-0160 decision 4: an allowlist. Tests and benches are not shipped — their
# path-only dev-dependencies are stripped from the `.crate` and half of them
# read `vendor/`, so they cannot build from it.
include = ["src/**", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

# Pass-through only: this crate compiles no second table of its own. The feature
# turns on `dict`'s FIXT 1.1 / FIX 5.0 SP2 tables so `tests/score_fixt.rs` and
# `tests/fixt.rs` can name `Fixt11Fix50Sp2Tables` (ADR-0080 decision 2).
[features]
fix50sp2 = ["fixbolt-dict/fix50sp2"]

[dependencies]
fixbolt-codec = { version = "=0.1.0", path = "../codec" }
fixbolt-dict = { version = "=0.1.0", path = "../dict" }

# The 59 acceptance definitions are this crate's gate (CLAUDE.md §2 rule 3), so
# the runner is a dev-dependency and the score is a test. conformance does not
# depend on session, so there is no cycle.
[dev-dependencies]
fixbolt-conformance = { path = "../conformance" }
# Framing belongs to the engine (DESIGN §2 L3). The score adapter stands in for
# an engine, so it calls the real one rather than keeping a second copy.
#
# `engine` depends on `session`, so this is a cycle — allowed, because a
# dev-dependency is not part of the library build. `cargo build -p
# fixbolt-session` does not compile `engine`; `cargo test -p fixbolt-session`
# does.
fixbolt-engine = { path = "../engine" }

[lints]
workspace = true

[[bench]]
name = "alloc"
harness = false

# Open item 39: the dictionary pass on every inbound message, timed on its own.
[[bench]]
name = "validate"
harness = false

# Open item 49: the session's own Heartbeat serialise, timed on its own.
[[bench]]
name = "heartbeat"
harness = false

# ADR-0160 decision 8: docs.rs builds a named feature list, never
# `all-features`. docs.rs passes `--cfg docsrs` itself, which turns on
# `feature(doc_cfg)` at the crate root so each gated item shows its feature.
[package.metadata.docs.rs]
features = ["fix50sp2"]
