[package]
name = "nanofix-session"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "The FIX 4.4 session state machine. Pure: no socket, no clock, no allocation"

[dependencies]
nanofix-codec = { path = "../codec" }
nanofix-dict = { path = "../dict" }

# The 59 acceptance definitions are this crate's gate (CLAUDE.md §2 rule 3), so
# the runner is a dev-dependency and the score is a test. conformance does not
# depend on session, so there is no cycle.
[dev-dependencies]
nanofix-conformance = { path = "../conformance" }

[lints]
workspace = true

[[bench]]
name = "alloc"
harness = false
