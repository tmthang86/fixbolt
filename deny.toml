# What a dependency is allowed to be, checked by `cargo deny check` in CI.
#
# **This file exists because this repository is going to be published.**
# `CLAUDE.md`'s first paragraph says every commit is treated as already public;
# a copyleft licence arriving three levels down a dependency tree is the way
# that goes wrong quietly, and nothing here looked. Plan:
# docs/plans/2026-09-07-three-gates-a-sibling-engine-has.md, step 1.
#
# `[measured 2026-09-08]` the whole workspace has **two** external runtime
# crates — `libc` and `roxmltree`, both `MIT OR Apache-2.0` — so this gate is
# cheap today and is here for the day it is not. A gate added after the
# dependency it would have caught is not a gate.
#
# **Every `ignore` below must carry a written reason.** Not "known issue": why
# the code path is unreachable in this workspace, or what replaces it and when.
# The habit is borrowed from another Rust FIX engine's `deny.toml`; the file
# itself is written from scratch.

[graph]
# Every target this workspace claims to build for. Left narrow deliberately:
# a target listed here that nobody builds turns an advisory about somebody
# else's platform into a red gate on this one.
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "aarch64-apple-darwin" },
]
# `affinity` and `standard` are optional and both pull `libc` (ADR-0015). With
# the default feature resolution this file would be judging a build nobody runs.
all-features = true

[advisories]
# A yanked crate is one its own author withdrew. `warn` is the default and a
# warning in a CI log is something nobody reads — CLAUDE.md §10.
yanked = "deny"
unmaintained = "workspace"
# Each entry needs the reason in a comment above it. Empty today.
ignore = []

[licenses]
# Permissive only, and compatible with this workspace's own
# `MIT OR Apache-2.0` (see `[workspace.package]` in Cargo.toml).
#
# **Apache-2.0 is on this list and it is not free.** It carries a `NOTICE`
# obligation — the same clause ADR-0001 goes out of its way to keep out of this
# repository for QuickFIX. A *dependency* under it is fine (it is not vendored
# and its NOTICE is not this project's to reproduce); *copied source* under it
# is not, and no amount of allow-listing here changes that.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
# `[measured 2026-09-12]` off by default because dev-dependencies never ship;
# on here because CLAUDE.md treats every commit as already public and a test
# helper under a copyleft licence is still a file in this repository's tree.
# Item 57's "could not be configured away" was the wrong table: the knob
# tried was [graph] exclude-dev. This one is what `check licenses` reads.
include-dev = true
# The default is 0.8. Raised because a licence text that only 80% matches a
# known one is exactly the case a human should look at.
confidence-threshold = 0.93
# The list above is deliberately wider than today's dependency tree, which has
# exactly two crates in it. Without this, four of the eight entries warn on
# every single run — permanent noise in an output CI asks a person to read, and
# the fastest way to teach somebody to stop reading it.
unused-allowed-license = "allow"

[bans]
# `warn`, not `deny`: two versions of one crate is a build-size and
# compile-time problem, not a correctness or licensing one, and this workspace
# has too few dependencies for it to be a real risk today.
multiple-versions = "warn"
# A wildcard version is a dependency whose contents can change with no commit
# in this repository — the shape STATUS.md item 19 is about, one layer out.
wildcards = "deny"
# `[measured 2026-09-08]` without this the gate was red on its first run, on
# **this workspace's own nine crates**: a `path` dependency carries no version,
# which reads as `*`. That is the intra-workspace case the setting is for, and
# the check still denies a wildcard on anything from a registry — which is the
# thing being guarded against.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

# ---------------------------------------------------------------------------
# WHAT THIS GATE SEES, now that `include-dev = true` is set above
#
# `[measured 2026-09-08]` the first attempt at closing this hole was `[graph]
# exclude-dev` and it changed nothing — the wrong table. `[measured
# 2026-09-12]` `[licenses] include-dev = true`, above, is the right one:
# `cargo deny check licenses` now judges this workspace's dev-dependencies
# exactly as it judges normal ones. An `MPL-2.0` crate in `[dev-dependencies]`
# is rejected immediately, with the same message a normal dependency gets.
#
# The CI job's crate-count comparison against `cargo tree` (both sides now
# include dev-dependencies) and `scripts/check-every-crate-is-licensed.sh`
# stay in place as an independent second route rather than being removed —
# `STATUS.md` open item 57;
# docs/reference/a-license-gate-that-cannot-see-dev-dependencies.md.
