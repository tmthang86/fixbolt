# CLAUDE.md §2 non-negotiable 7 denies unwrap/expect/panic through
# `[workspace.lints.clippy]`, and DESIGN.md §6's clippy gate runs with
# `-D warnings`. Those two together mean the toolchain is load-bearing:
# `-D warnings` denies every lint the installed clippy knows, including ones
# released after this code was written.
#
# `[measured 2026-08-30]` that is not hypothetical. CI installed whatever stable
# was current, and `clippy::byte_char_slices` — a lint absent from 1.94.1 and
# 1.95.0 — turned `main` red with no commit behind it. STATUS.md open item 19.
#
# So the toolchain is pinned and upgraded deliberately. The `clippy-latest-stable`
# job in .github/workflows/ci.yml runs the newest stable WITHOUT blocking merges,
# so the next such lint arrives as a warning to read rather than as a red morning
# spent looking for what you broke.
#
# Pinned to the newest stable that the workspace passes, not to an older one:
# pinning backwards trades one surprise for a slow drift away from the compiler
# everyone else is on.
[toolchain]
channel = "1.98.0"
components = ["rustfmt", "clippy"]
