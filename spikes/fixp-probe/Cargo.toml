# Deliberately OUTSIDE the workspace, like spikes/ktls (ADR-0140 decision 1).
# The empty [workspace] table detaches it and the root manifest `exclude`s it,
# so `cargo test --all` at the root never compiles it — and so never needs
# vendor/fixp/binary_entrypoint.xml, a B3 schema that is fetched by
# scripts/fixp-spike.sh and never committed (ADR-0140 decision 3).
#
# This is a spike: one straight-line program, not a FIXP session. Nothing in
# crates/ or tools/ depends on it. docs/plans/2026-09-23-p3-fixp-spike.md.
[package]
name = "fixbolt-fixp-probe"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
# Only the reader and the writer; `encoding` (the codec::Encoding impl) is not
# needed here, so the probe does not pull fixbolt-codec in.
fixbolt-sbe = { path = "../../crates/sbe", default-features = false }

[build-dependencies]
fixbolt-sbe-gen = { path = "../../crates/sbe-gen" }

[[bin]]
name = "fixp-probe"
path = "src/main.rs"

# A copy of the root manifest's [workspace.lints] — a detached crate does not
# inherit them, and a lint table no one runs is not a lint table (plan, "Bẫy":
# "Lint của crate tách rời không ai thấy"). The reasons for each line are in
# the root Cargo.toml; keep the two in step.
[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
