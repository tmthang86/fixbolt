[package]
name = "fixbolt-interop"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

# **No C++ here, and that is the point.** `CLAUDE.md` §2 rule 6 and ADR-0004
# decision 7 both say the same thing: `libquickfix` lives in CI and in
# `scripts/`, never in a `Cargo.toml` and never on a user's machine. This crate
# is ordinary Rust that opens a socket; `scripts/interop.sh` is what builds the
# C++ acceptor on the other end of it.
#
# So `cargo test --all --no-default-features` on a machine with no CMake still
# builds this, and `scripts/check-no-optional-deps.sh` has nothing new to say.
# `[2026-09-04]` **This tool has a `[features]` block now, and it is not
# decoration.** The acceptor role calls `fixbolt::serve`, which exists only
# behind `standard` on unix. A tool that switches a library feature on without
# declaring it is the trap `tools/w2w` already paid for: cargo unifies features
# across one invocation, so `cargo test --all --no-default-features` compiled
# `libc` anyway and the gate was green about a build that never happened
# (`docs/reference/feature-flags-unify-across-a-workspace.md`). Declared here,
# `#[cfg]`-gated on the item in `src/main.rs`, and asked per crate by
# `scripts/check-no-optional-deps.sh` — non-negotiable 6.
# `[2026-09-05]` **`fixbolt-engine` is a direct dependency, and the feature has
# to be forwarded to BOTH crates.** `--role reconnect` calls
# `fixbolt_engine::connect_and_serve`, which the `fixbolt` facade does not
# re-export (`GUIDE.md` §8c calls it by its full path for the same reason).
# Forwarding to `fixbolt` alone would leave `fixbolt-engine/standard` off, and
# the role would fail to compile for a reason that reads like a missing item.
[features]
default = ["standard"]
standard = ["fixbolt/standard", "fixbolt-engine/standard"]

[dependencies]
fixbolt = { path = "../../crates/library", default-features = false }
fixbolt-engine = { path = "../../crates/engine", default-features = false }
fixbolt-session = { path = "../../crates/session" }

[lints]
workspace = true

[[bin]]
name = "interop"
path = "src/main.rs"
