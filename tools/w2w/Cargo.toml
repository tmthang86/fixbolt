[package]
name = "fixbolt-w2w"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

# `[measured 2026-08-30]` THIS BLOCK IS NOT DECORATION. Without it,
# `#[cfg(feature = "standard")]` in `src/main.rs` refers to a feature **this**
# crate does not have — features are per-crate, and a `cfg` never reaches into a
# dependency's. Every such branch silently took its `else`, so `--mode standard`
# was accepted, printed its banner, and ran nothing. The binary worked; the mode
# did not exist. `CLAUDE.md` §2 rule 6 guards the mirror image of this — a
# feature in the manifest whose `mod` is not behind `#[cfg]` — and this is the
# same mistake from the other side.
[features]
default = ["standard"]
standard = ["fixbolt-engine/standard"]

# ADR-0015 keeps pinning opt-in, and the same reasoning applies here: a build
# with no features must stay dependency-free. It is NOT in `default` on purpose
# — putting it there would turn on `fixbolt-engine/affinity` for every
# `cargo test --all`, because cargo unifies features across one invocation
# (`docs/reference/feature-flags-unify-across-a-workspace.md`), and the engine's
# affinity tests want a box with isolated cores rather than any CI runner.
#
# `src/main.rs` refuses `--engine-core` without it rather than ignoring the
# flag, which is the lesson the `standard` block above was written for.
affinity = ["fixbolt-engine/affinity"]

# `[2026-09-13]` step 6a of `docs/plans/2026-09-04-tls.md`: `--tls ktls` and
# `--tls userspace`, so `DESIGN.md` §8's three TLS rows come from the same
# harness as the plain one. Not in `default`, for the reason `affinity` above is
# not: `cargo test --all` would switch `fixbolt-engine/tls` on for every crate
# in the invocation. `src/main.rs` refuses `--tls` other than `off` without it.
#
# `rustls` is named here because the client end and the server configuration
# are built in this binary; `rcgen` makes the self-signed certificate at start-up
# rather than committing one that expires. Both are **optional normal**
# dependencies, so `scripts/check-no-optional-deps.sh` asks for each by name.
tls = ["fixbolt-engine/tls", "dep:rustls", "dep:rcgen"]
# `--journal sqlite-async` (plan docs/plans/2026-09-24-p4-sqlite-store.md row
# 6). Off by default: it compiles SQLite's C, and a no-flag build must stay the
# engine this tool always timed. `scripts/check-no-optional-deps.sh` asks for
# `fixbolt-w2w:rusqlite` by name.
sqlite = ["dep:fixbolt-store-sqlite"]

[dependencies]
fixbolt-engine = { path = "../../crates/engine" }
fixbolt-session = { path = "../../crates/session" }

# `--path app` builds an `ExecutionReport` template once and patches it per
# message, which is D9's shape. Neither crate has a runtime dependency of its
# own, so this adds nothing to the tree.
fixbolt-codec = { path = "../../crates/codec" }
fixbolt-dict = { path = "../../crates/dict" }
fixbolt-store-sqlite = { path = "../../crates/store-sqlite", optional = true }

# `--metrics <addr>` (phase 4 row 1 step 5, ADR-0170): the exporter beside the
# engine, so the kill line's scrape-on/scrape-off pair (row 2) is measured by the
# same binary, in the same process, with `allocs` counted on every thread —
# the exporter's included. It has no dependency of its own beyond
# `fixbolt-engine`, so this adds no crate from outside the workspace.
fixbolt-metrics = { path = "../../crates/metrics" }

# The `tls` feature above, and nothing else. `ring` rather than rustls's default
# `aws_lc_rs`, for the reason `crates/engine/Cargo.toml` gives: `aws-lc-sys`
# needs cmake. rcgen 0.14's own defaults are `crypto`, `pem` and `ring`, the same
# spelling as the engine's dev-dependency, so this adds no crate to the lock.
rustls = { version = "0.23.43", default-features = false, features = [
    "std",
    "ring",
], optional = true }
rcgen = { version = "0.14", optional = true }

# `[2026-09-14]` step A3b of `docs/plans/2026-09-04-the-second-linux-desk.md`:
# `--wire-timestamps`. `socket(AF_PACKET)`, `setsockopt(SO_TIMESTAMPING)`,
# `recvmsg(MSG_ERRQUEUE)` with its control messages, and the `SIOCSHWTSTAMP`
# ioctl have no `std` spelling. Linux-only by `cfg(target_os)` and not by a
# feature: the flag means nothing elsewhere, and `w2w` is not a library with a
# no-optional build to keep clean (the plan's rule-6 row). The spelling is the one
# `crates/engine` already uses, so `Cargo.lock` gains no crate (0.2.189 at the
# time of writing); on macOS nothing is pulled at all.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[lints]
workspace = true

[[bin]]
name = "w2w"
path = "src/main.rs"
