[package]
name = "fixbolt-w2w"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

# `[measured 2026-08-30]` THIS BLOCK IS NOT DECORATION. Without it,
# `#[cfg(feature = "standard")]` in `src/main.rs` refers to a feature **this**
# crate does not have — features are per-crate, and a `cfg` never reaches into a
# dependency's. Every such branch silently took its `else`, so `--mode standard`
# was accepted, printed its banner, and ran nothing. The binary worked; the mode
# did not exist. `CLAUDE.md` §2 rule 6 guards the mirror image of this — a
# feature in the manifest whose `mod` is not behind `#[cfg]` — and this is the
# same mistake from the other side.
[features]
default = ["standard"]
standard = ["fixbolt-engine/standard"]

# ADR-0015 keeps pinning opt-in, and the same reasoning applies here: a build
# with no features must stay dependency-free. It is NOT in `default` on purpose
# — putting it there would turn on `fixbolt-engine/affinity` for every
# `cargo test --all`, because cargo unifies features across one invocation
# (`docs/reference/feature-flags-unify-across-a-workspace.md`), and the engine's
# affinity tests want a box with isolated cores rather than any CI runner.
#
# `src/main.rs` refuses `--engine-core` without it rather than ignoring the
# flag, which is the lesson the `standard` block above was written for.
affinity = ["fixbolt-engine/affinity"]

[dependencies]
fixbolt-engine = { path = "../../crates/engine" }
fixbolt-session = { path = "../../crates/session" }

# `--path app` builds an `ExecutionReport` template once and patches it per
# message, which is D9's shape. Neither crate has a runtime dependency of its
# own, so this adds nothing to the tree.
fixbolt-codec = { path = "../../crates/codec" }
fixbolt-dict = { path = "../../crates/dict" }

[lints]
workspace = true

[[bin]]
name = "w2w"
path = "src/main.rs"
